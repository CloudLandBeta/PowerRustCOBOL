[package]
name        = "cobolt-web-bundle"
description = "The Web bundle assembler (WASM-002): host page, loader, manifest, CSP and isolation headers, integrity hashes, and a static dev server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
cobolt-wasm-abi = { path = "../cobolt-wasm-abi", features = ["scan"] }
# `security.txt` (WASM-013 Q4): the one text the bundle and the backend both write, `cobolt_wire::security_txt`.
cobolt-wire = { path = "../cobolt-wire", default-features = false }
# The form model: a bundle's form descriptions are the .cfrm with the program code taken out
# (WASM-016 R4), read and written by the model's own loader/serialiser so that nothing is re-implemented.
cobolt-forms = { path = "../cobolt-forms", default-features = false }
serde        = { workspace = true }
serde_json   = { workspace = true }
sha2         = { workspace = true }
# The family a project's font file under Assets/ declares (its `name` table), so that the face is bundled for
# the forms that name it (WASM-004 Q5). The version fontdb already brings in, in the lock file.
ttf-parser   = "0.25"

[dev-dependencies]
tempfile = "3"
# A crafted module for the "asks for an import ABI v1 does not have" test.
wasm-encoder = "0.244"
# The mock backend of the tests: a WebSocket server in a few lines. Already in the lock file.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The mock speaks the sealed channel (WASM-003 T15b-3): the same crate the backend and the player use.
cobolt-wire = { path = "../cobolt-wire", features = ["channel"] }
getrandom = "0.4"
# The browser test samples the colours a screenshot shows (WASM-016 AC13). Both already in the lock file.
png = "0.17"
base64 = "0.22"
cobolt-wasm-abi = { path = "../cobolt-wasm-abi", features = ["scan", "fixture"] }
# WASM-017 T11: the scenario project is built by the product's own Web Build (a dev-dependency cycle, which cargo allows).
cobolt-project-tools = { path = "../cobolt-project-tools" }
# The desktop's own animation arithmetic (`cobolt_forms::anim`, behind its `render` feature): the oracle a page's
# motion is measured against (tests/page_motion_p4.rs).
cobolt-forms = { path = "../cobolt-forms", default-features = false, features = ["render"] }
# The desktop's projected outline of a tilted control (`perspective::Perspective::quad` takes an egui `Rect`):
# the oracle of tests/page_border_look.rs. The version cobolt-forms uses, already in the lock file.
egui = "0.36"
