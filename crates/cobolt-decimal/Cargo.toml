[package]
name        = "cobolt-decimal"
description = "Cobolt COBOL — the exact decimal kernel (no_std, no alloc), shared by the interpreter and by the WebAssembly support routines"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# No dependencies on purpose: this crate is compiled to wasm32 and linked into
