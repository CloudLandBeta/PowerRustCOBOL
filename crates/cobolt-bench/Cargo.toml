[package]
name        = "cobolt-bench"
description = "PowerRustCOBOL — performance and allocation baseline harness"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish     = false

[[bin]]
name = "cobolt-bench"
path = "src/main.rs"

[features]
# The WebAssembly module rows (WASM-015 T14). Off by default: it pulls in the host (`wasmtime`), which the
# interpreter baseline has no use for.
wasm = ["dep:cobolt-wasm"]

[dependencies]
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-ast      = { path = "../cobolt-ast" }
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
cobolt-runtime  = { path = "../cobolt-runtime" }
redb            = "4.3"
# DESKTOP-WASM-001 T3 (R26): the ten-times reference project is written as forms and indexed
# files, and measured after regenerating them as a Build does.
cobolt-forms    = { path = "../cobolt-forms" }
cobolt-codegen  = { path = "../cobolt-codegen" }
serde           = { workspace = true }
toml            = { workspace = true }
sha2            = { workspace = true }
cobolt-wasm     = { path = "../cobolt-wasm", optional = true }

[dev-dependencies]
# T3: the ten-times project is checked by the project tools, as an agent checks a project.
cobolt-project-tools = { path = "../cobolt-project-tools" }
serde_json           = { workspace = true }
