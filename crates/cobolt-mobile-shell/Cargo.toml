# The MOBILE SHELL (WASM-012): the Rust half of a Mobile application's Android
# and iOS package. A Mobile build stages this crate beside a small generated
# application crate (its `tauri.conf.json`, capability file and icons are
# written by `cobolt_compiler::mobile_build`) and hands both to the Tauri 2
# CLI. It is its OWN Cargo workspace, like the player:
#   1. Tauri, wry and the plugins add a few hundred packages only a phone build
#      needs; the main workspace's lock stays free of them.
#   2. The versions are pinned here (D-Pin: Tauri tracks the IDE), and this
#      crate's Cargo.lock is copied into every staged build, so a package is
#      built from exactly the closure tests/dependency_guard.rs checked.
# No Kotlin, Swift or Java is written for it (D-Native): the plugins' own
# native parts come from crates.io, the Android Keystore and the iOS Keychain
# are reached from Rust (keyring-core and its two native stores).

[package]
name         = "cobolt-mobile-shell"
description  = "The PowerRustCOBOL mobile shell — the Tauri 2 host of a Mobile application on Android and iOS"
version      = "2.0.0"
edition      = "2021"
rust-version = "1.92"
license      = "Apache-2.0"
publish      = false

[workspace]

[lib]
name = "cobolt_mobile_shell"
path = "src/lib.rs"

[features]
default = []
# The device features of WASM-012 R9 (`cobolt_compiler::mobile_features`): the
# staged application enables exactly the ones the project declares.
secure-storage = ["dep:keyring-core", "dep:android-native-keyring-store", "dep:apple-native-keyring-store"]
open-address   = ["dep:tauri-plugin-opener"]
deep-link      = ["dep:tauri-plugin-deep-link"]

[dependencies]
# D-Pin: the version set recorded in the WASM-012 plan's V0 record (§9).
tauri                  = { version = "=2.12.5", default-features = false, features = ["wry", "compression"] }
tauri-plugin-opener    = { version = "=2.7.2", optional = true }
tauri-plugin-deep-link = { version = "=2.6.3", optional = true }
keyring-core           = { version = "=1.0.1", optional = true }
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { version = "=1.0.0", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", optional = true, default-features = false, features = ["protected"] }

[dev-dependencies]
# Not used by the library: listed so this crate's lock pins the build-time half
# the staged application's build script uses (`tauri_build::build()`).
tauri-build = { version = "=2.7.4", default-features = false }
toml = "0.8"
