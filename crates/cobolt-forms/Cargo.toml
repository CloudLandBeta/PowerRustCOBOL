[package]
name        = "cobolt-forms"
description = "Cobolt — form and control data model with XML serialization (.cfrm files)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
toml        = { workspace = true }
quick-xml   = { workspace = true }
hmac        = { workspace = true }
sha2        = { workspace = true }
indexmap    = { workspace = true }
thiserror   = { workspace = true }
egui        = { version = "0.30", optional = true }
fontdb      = { version = "0.23", optional = true }
ab_glyph    = { version = "0.2.32", optional = true }
cobolt-media = { path = "../cobolt-media", optional = true }
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
resvg       = { version = "0.46", optional = true }

[features]
render = ["dep:egui", "dep:fontdb", "dep:ab_glyph", "dep:cobolt-media", "dep:image", "dep:resvg"]

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
