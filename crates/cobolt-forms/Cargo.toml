[package]
name        = "cobolt-forms"
description = "Cobolt — form and control data model with XML serialization (.cfrm files)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
# The shipped Rust-type table lives in cobolt-ast so the form model and
# semantic analysis cannot disagree about it (spec 041 R8).
cobolt-ast  = { path = "../cobolt-ast" }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
toml        = { workspace = true }
quick-xml   = { workspace = true }
hmac        = { workspace = true }
sha2        = { workspace = true }
indexmap    = { workspace = true }
thiserror   = { workspace = true }
egui        = { version = "0.36", optional = true }
fontdb      = { version = "0.23", optional = true }
# Validate font faces with the SAME parser egui/epaint >=0.34 uses (skrifa),
# so we never feed it a face it cannot rasterise (e.g. bitmap-only fonts).
skrifa      = { version = "0.42", optional = true }
cobolt-media = { path = "../cobolt-media", optional = true }
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
resvg       = { version = "0.46", optional = true }
egui-elegance = { version = "0.15.0", optional = true }
# Matches cobolt-runtime's ureq major version (2, native-tls not rustls —
# ring compiles C) for one HTTP-client shape across the workspace, though
# this crate's usage (OSM tile fetch, spec 039) is independent of it.
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"], optional = true }
# A toolbar button's Copy/Cut/Paste and its window capture need the real OS
# clipboard — text BOTH ways and an image out, which egui's own `copy_text` does
# not cover. Already in the lock file: `egui-winit` depends on it, so this is a
# direct edge onto a crate the build compiles either way.
arboard     = { version = "3.6", optional = true }

[features]
render = ["dep:egui", "dep:fontdb", "dep:skrifa", "dep:cobolt-media", "dep:image", "dep:resvg", "dep:egui-elegance", "dep:ureq", "dep:arboard"]

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
