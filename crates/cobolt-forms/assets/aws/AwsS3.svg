<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hand-drawn for PowerRustCOBOL in the style of the AWS service icons
       (spec 078, amendment A5): the storage tile, with a bucket. Not an AWS file and not traced from one. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1B660F"/>
      <stop offset="1" stop-color="#6CAE3E"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="6" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="32" cy="17" rx="18" ry="6"/>
    <path d="M14 17 L19 47 Q32 54 45 47 L50 17"/>
  </g>
</svg>
