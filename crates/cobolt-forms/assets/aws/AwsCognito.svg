<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hand-drawn for PowerRustCOBOL in the style of the AWS service icons
       (spec 078, amendment A5): the security tile, with a user under a key. Not an AWS file and not traced from one. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#BD0816"/>
      <stop offset="1" stop-color="#FF5252"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="6" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="22" r="7"/>
    <path d="M12 50 Q12 34 26 34 Q34 34 37 40"/>
    <circle cx="44" cy="40" r="5"/>
    <path d="M44 45 V54 M44 50 H48"/>
  </g>
</svg>
