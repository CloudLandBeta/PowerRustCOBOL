<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hand-drawn for PowerRustCOBOL in the style of the AWS service icons
       (spec 078, amendment A5): the machine-learning tile, with a speech balloon over a stack of records. Not an AWS file and not traced from one. -->
