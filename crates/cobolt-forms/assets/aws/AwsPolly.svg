    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="6" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 24 H20 L30 16 V48 L20 40 H12 Z"/>
    <path d="M37 25 Q41 32 37 39 M43 20 Q50 32 43 44 M49 15 Q58 32 49 49"/>
