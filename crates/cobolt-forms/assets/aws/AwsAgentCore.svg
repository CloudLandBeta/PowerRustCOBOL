<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hand-drawn for PowerRustCOBOL in the style of the AWS service icons
       (spec 078, amendment A5): the machine-learning tile, with an agent'\''s head and its signal. Not an AWS file and not traced from one. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#055F4E"/>
      <stop offset="1" stop-color="#56C0A7"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="6" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="24" width="32" height="24" rx="6"/>
    <circle cx="26" cy="36" r="3"/>
    <circle cx="38" cy="36" r="3"/>
    <path d="M32 24 V15"/>
    <circle cx="32" cy="12" r="2.5"/>
  </g>
</svg>
