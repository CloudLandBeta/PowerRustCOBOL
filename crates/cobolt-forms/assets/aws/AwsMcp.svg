<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hand-drawn for PowerRustCOBOL in the style of the AWS service icons
       (spec 078, amendment A5): the management-and-tools tile, with one client
       linked to two tool servers. Not an AWS file and not traced from one. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B0084D"/>
      <stop offset="1" stop-color="#FF4F8B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="6" fill="url(#tile)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round">
    <circle cx="20" cy="32" r="6"/>
    <circle cx="44" cy="19" r="6"/>
    <circle cx="44" cy="45" r="6"/>
    <path d="M25.5 29 L38.6 21.9 M25.5 35 L38.6 42.1"/>
  </g>
</svg>
