[package]
name         = "cobolt-project-tools"
description  = "The coding-agent tools (spec 080) — one MCP tool set over a PowerRustCOBOL project, served by rcrun (stdio) and the IDE (HTTP)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# Tooling, never output: like `cobolt-cli`, nothing a built application links
# depends on this crate, so it is not one of the compiler's SDK crates.

[dependencies]
cobolt-mcp      = { path = "../cobolt-mcp" }
cobolt-codegen  = { path = "../cobolt-codegen" }
cobolt-compiler = { path = "../cobolt-compiler" }
cobolt-forms    = { path = "../cobolt-forms" }
cobolt-indexed  = { path = "../cobolt-indexed" }
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
# The web build (WASM-010 T19): the WebAssembly generator, with its `host` feature
# so the Build measures the module's start-up natively on wasmtime (operator,
# 2026-10-22: wasmtime 44.0.3, the IDE included), and the bundler.
cobolt-wasm       = { path = "../cobolt-wasm" }
cobolt-web-bundle = { path = "../cobolt-web-bundle" }
# The host-API version a pinned player must speak (WASM-016 R11).
cobolt-wasm-abi = { path = "../cobolt-wasm-abi" }
cobolt-ast        = { path = "../cobolt-ast" }
# For `builtins::BUILTINS` only — the kb_lookup tool's built-in entries.
cobolt-runtime  = { path = "../cobolt-runtime" }
# kb_search reads the System KB store through its shared reader (spec 084 T5).
cobolt-kb       = { path = "../cobolt-kb" }
# The IDE's machine configuration, for the tool server's port (spec 084 R20a).
dirs            = "5.0"

serde      = { workspace = true }
serde_json = { workspace = true }
# Manifest edits that keep every byte the tools do not own (comments, key
# order, unknown tables). The 0.22 line is the one `toml` 0.8 already pulls.
toml_edit  = "0.22"
# The kind tables of a new project, written by the serializer the IDE saves
# with, so a manifest made here and one the IDE saves are the same bytes.
toml       = { workspace = true }
# The External Crates registry client (spec 044), moved down from the IDE so
# `add_crate` can register a crate without it: the blocking HTTP stack the IDE
# uses (ureq + an explicit native-tls, never rustls/ring), the `.crate`
# unpacker and cargo's own version semantics.
ureq       = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"
tar        = "0.4"
flate2     = { workspace = true }
semver     = "1"

[dev-dependencies]
# The web build's tests read each program module's import section (WASM-002 AC4b).
cobolt-wasm-abi = { path = "../cobolt-wasm-abi", features = ["scan"] }
