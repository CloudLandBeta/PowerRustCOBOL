[package]
name         = "cobolt-dap"
description  = "Wire-compatible Debug Adapter Protocol for PowerRustCOBOL — framing, types, client and adapter server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
# The protocol IS JSON. Bodies we do not model stay `Value`, so an unknown
# request survives a round trip instead of being dropped on the floor.
serde      = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
