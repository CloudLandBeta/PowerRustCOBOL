# The PLAYER (WASM-016): the prebuilt form engine that draws any form in a
# browser and hosts the generated program module (ABI v1). It is its OWN Cargo
# workspace, built with `--manifest-path`, for three reasons recorded in
# specs/WASM-016-prebuilt-player/plan.md:
#   1. wasm-bindgen must equal the installed `wasm-bindgen` CLI *exactly*
#      (0.2.129); the main workspace's lock pins 0.2.126 for other consumers.
#   2. wasm-bindgen and web-sys add ~100 packages that only a wasm32 build needs, and the
#      other agents of the 2.x.x line edit the main lock file in parallel.
#   3. The threaded variant is built with a pinned nightly and `-Zbuild-std`,
#      which must stay confined to this crate's build step (WASM-017 R16).
# Its dependency closure is checked by tests/dependency_guard.rs (the main
# workspace's guard reads only the main lock file).

[package]
name        = "cobolt-web-player"
description = "The PowerRustCOBOL player — draws any form in the browser and hosts the generated program module (ABI v1)"
version     = "2.0.0"
edition     = "2021"
rust-version = "1.92"
license     = "Apache-2.0"
publish     = false

[workspace]
members = [".", "parts/mermaid", "parts/canvas", "parts/pdf"]

# The Mermaid renderer reads `std::time::Instant::now()` unconditionally, which panics on
# `wasm32-unknown-unknown`: every diagram trapped in the browser. The copy under vendor/ differs from
# 0.2.2 only by a clock that exists on `wasm32` (see its Cargo.toml). It applies to THIS workspace only;
# the main workspace's lock file keeps crates.io's crate. Drop the patch when upstream has the fix.
[patch.crates-io]
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
# `lopdf` 0.26 (the PDF reader) reaches `time` 0.2, whose `stdweb` cannot be built for the browser. The copy
# under vendor/time differs from 0.2.27 only by dropping `stdweb` (see its Cargo.toml); the PDF part needs it.
time = { path = "vendor/time" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default  = []
# Rayon on a worker pool (WASM-017 R19a): DataGrid sorting and filtering. Built only by the
# threaded variant (nightly, atomics, shared memory); the plain player runs the same code sequentially.
threaded = ["rayon", "dep:wasm-bindgen-rayon"]
# Rayon alone (no wasm-bindgen glue): lets the native tests prove that the parallel sort gives the
# same result as the sequential one.
rayon = ["dep:rayon"]

[dependencies]
cobolt-forms    = { path = "../cobolt-forms", default-features = false }
cobolt-wasm-abi = { path = "../cobolt-wasm-abi" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
indexmap    = { version = "2", features = ["serde"] }
rayon       = { version = "1", optional = true }
# Reads the SVG the icon catalogue and the diagram renderer write, to build DOM nodes from an
# allow-list of elements and attributes (view/svg.rs) - the player never inserts markup.
quick-xml   = "0.36"

# Native only: the fingerprint of the player's source (src/fingerprint.rs, WASM-016 R12), which
# build_player records and the freshness test checks. The browser build never links it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.10"

# The browser crates are `wasm32` only: a native `cargo test` of the pure layers (the ABI host,
# the state, the policies) compiles none of them, which keeps the test loop fast and small. The
# DOM modules are `#[cfg(target_arch = "wasm32")]` and are checked and built for the
# browser target, which is what ships.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen-rayon = { version = "1.3", optional = true }
# The browser half's framework (WASM-016 R1; plan C1): Leptos 0.8.22, the newest stable release on
# 2026-10-23 (0.9 is a release candidate), MIT, rust-version 1.88, `wasm-bindgen = "^0.2"` — so it takes
# the pinned 0.2.129 above. Client-side rendering only; no server functions, no hydration.
leptos = { version = "=0.8.22", default-features = false, features = ["csr"] }
# Leptos's executor interface and the local pool the node layer runs it on, so a render pass is applied
# before the page reads the elements back (src/dom/reactive.rs). Both were already in Leptos's closure.
any_spawner = "=0.3.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement",
    "HtmlOptionElement", "HtmlButtonElement", "HtmlDialogElement", "HtmlCanvasElement", "HtmlImageElement",
    "HtmlAnchorElement", "HtmlProgressElement", "HtmlFormElement", "Node", "NodeList", "Text", "CssStyleDeclaration",
    "DomTokenList", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "FocusEvent", "InputEvent", "WheelEvent",
    "PointerEvent", "TouchEvent", "CustomEvent", "CustomEventInit", "Location", "History", "Navigator", "Url",
    "UrlSearchParams", "Storage", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BroadcastChannel",
    "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "DomRect", "MediaQueryList", "Performance",
    "AddEventListenerOptions", "EventListenerOptions", "Blob", "BlobPropertyBag", "File", "FileList", "DataTransfer",
    "FileReader", "Crypto", "SvgElement", "SvgsvgElement", "ShadowRoot", "ShadowRootInit", "ShadowRootMode",
    "CssStyleSheet", "CssRuleList", "DocumentFragment", "CanvasRenderingContext2d", "DomException", "ScrollToOptions",
    "ScrollBehavior", "FocusOptions", "HtmlCollection", "ProgressEvent", "StorageEvent",
    "PageTransitionEvent", "HashChangeEvent", "PopStateEvent", "HtmlLinkElement", "HtmlStyleElement", "HtmlHeadElement",
    "console", "Range", "ImageData",
] }

[dev-dependencies]
# The engine the native tests run the program modules on: the generator's own (operator,
# 2026-10-22, WASM-010 Q2 and Q-new-2), pinned as in the main workspace. A dev-dependency of the
# native tests only: the browser build never links it (tests/dependency_guard.rs).
wasmtime = { version = "=44.0.3", default-features = false, features = ["cranelift", "runtime", "std"] }
tempfile = "3"
# The Mermaid renderer the browser player loads as a part: the native tests turn it on here to give the
# view layer a real answer to read (the player itself depends on `cobolt-forms` without it).
cobolt-forms = { path = "../cobolt-forms", default-features = false, features = ["mermaid"] }
cobolt-wasm-abi = { path = "../cobolt-wasm-abi", features = ["fixture", "scan"] }

# The size-first profile of WASM-017 R16. `opt-level = "s"` is the operator's ruling (WASM-017 Q8),
# not the smaller choice: on the 2026-10-20 source "s" cost +581,902 bytes before wasm-opt against "z"
# (2,718,057 against 2,136,155); `build_player --measure` records the current cost in player-build.json.
# `panic = "abort"` is what lets a panic end the instance cleanly; symbols are stripped; `wasm-opt -Os`
# runs afterwards (examples/build_player.rs).
[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false
