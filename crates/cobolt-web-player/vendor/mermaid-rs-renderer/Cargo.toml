# mermaid-rs-renderer 0.2.2 (MIT, https://github.com/1jehuang/mermaid-rs-renderer), vendored by
# PowerRustCOBOL for the browser player's Mermaid part (WASM-016 R13). The ONE change is that
# `std::time::Instant` is replaced by `crate::instant::Instant` (src/instant.rs): on
# `wasm32-unknown-unknown` the standard library's `Instant::now()` panics ("time not implemented on
# this platform"), and the layout calls it unconditionally for stage timings, so every diagram trapped.
# The shim is `std::time::Instant` everywhere else and a clock that always reads zero on `wasm32`, which
# is only ever used for the timings the caller may print. Nothing else differs, and the defaults are
# off (no command-line interface, no PNG) because the player needs only the SVG. This copy is used
# through `[patch.crates-io]` in the player's own workspace; the main workspace keeps crates.io's.

[package]
edition = "2024"
name = "mermaid-rs-renderer"
version = "0.2.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast Mermaid diagram renderer in pure Rust (vendored for the PowerRustCOBOL player; see the note above)"
license = "MIT"
repository = "https://github.com/1jehuang/mermaid-rs-renderer"

[features]
cli = ["dep:clap"]
default = []
png = ["dep:resvg", "dep:usvg"]

[lib]
name = "mermaid_rs_renderer"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.fontdb]
version = "0.23"

[dependencies.json5]
version = "1.3"

[dependencies.once_cell]
version = "1.19"

[dependencies.regex]
version = "1.12"

[dependencies.resvg]
version = "0.46"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.ttf-parser]
version = "0.25"

[dependencies.usvg]
version = "0.46"
optional = true
