# A PART of the player (WASM-016 R13): the Viewer's PDF reader, a WebAssembly module of its own that
# the player loads the first time a Viewer shows a PDF. Member of the player's own Cargo workspace.

[package]
name        = "cobolt-web-part-pdf"
description = "The player's PDF part: PDF bytes in, the pages' text and size out (cobolt-forms' own reader)"
version     = "2.0.0"
edition     = "2021"
rust-version = "1.92"
license     = "Apache-2.0"
publish     = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cobolt-forms = { path = "../../../cobolt-forms", default-features = false, features = ["pdf-reader"] }
wasm-bindgen = "=0.2.129"
