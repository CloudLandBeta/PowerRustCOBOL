[package]
name        = "cobolt-compiler"
description = "Cobolt — embed+bundle binary compiler: COBOL project → single native executable"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-ast      = { path = "../cobolt-ast" }
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
cobolt-forms    = { path = "../cobolt-forms" }

serde      = { workspace = true }
serde_json = { workspace = true }
semver    = "1"
toml      = { workspace = true }
bincode   = { workspace = true }
flate2    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

# Test-only (spec 044 e2e): the tests vendor fixture crates exactly as the
# IDE does — download + unpack. The SHIPPED compiler stays network-free;
# builds use the project-local `crates/` only.
[dev-dependencies]
ureq       = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
tar        = "0.4"
