[package]
name        = "cobolt-compiler"
description = "Cobolt — embed+bundle binary compiler: COBOL project → single native executable"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-ast      = { path = "../cobolt-ast" }
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
cobolt-wire     = { path = "../cobolt-wire" }
# WASM-003 — only the loader (read and pack a backend project): no sockets, no TLS.
cobolt-server   = { path = "../cobolt-server", default-features = false, features = ["loader"] }
cobolt-forms    = { path = "../cobolt-forms" }
# A build regenerates the forms' generated COBOL first, as the IDE does.
cobolt-codegen  = { path = "../cobolt-codegen" }
# The System KB's "What runs in a browser module" is written from the WebAssembly
# generator's own tables (WASM-010 D7). Without its engine: the compiler runs nothing.
cobolt-wasm     = { path = "../cobolt-wasm", default-features = false }

serde      = { workspace = true }
serde_json = { workspace = true }
semver    = "1"
# The main-form designation seal (`main_form_guard`).
sha2      = { workspace = true }
toml      = { workspace = true }
bincode   = { workspace = true }
flate2    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

# Test-only (spec 044 e2e): the tests vendor fixture crates exactly as the
# IDE does — download + unpack. The SHIPPED compiler stays network-free;
# builds use the project-local `crates/` only.
[dev-dependencies]
# WASM-014: the parity test serves a backend in-process and runs a built binary against it.
cobolt-server = { path = "../cobolt-server" }
# WASM-010 T22: the browser-subset section must name every built-in of the runtime.
cobolt-runtime = { path = "../cobolt-runtime" }
ureq       = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
tar        = "0.4"
