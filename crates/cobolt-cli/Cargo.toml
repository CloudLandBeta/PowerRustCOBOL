[package]
name        = "cobolt-cli"
description = "rcrun — RustCOBOL command-line runtime: `rcrun run myprogram.cbl`"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "rcrun"
path = "src/main.rs"

[dependencies]
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-ast      = { path = "../cobolt-ast" }
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
cobolt-runtime  = { path = "../cobolt-runtime" }
cobolt-stdlib   = { path = "../cobolt-stdlib" }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }

# Phase 9 — project packaging
serde      = { workspace = true }
serde_json = { workspace = true }
bincode    = { workspace = true }
toml      = { workspace = true }
zip       = { version = "2", default-features = false, features = ["deflate"] }  # no defaults: bzip2/lzma/zstd are C libraries we never use

# Phase 11 — binary compiler
cobolt-compiler = { path = "../cobolt-compiler" }

# Standalone GUI form runner (`rcrun run-form`) — the same renderer the IDE and
# compiled binaries use, so Run Form in the IDE is a faithful external process.
cobolt-forms = { path = "../cobolt-forms", features = ["render"] }
cobolt-media = { path = "../cobolt-media" }
egui         = "0.36"
eframe       = { version = "0.36", features = ["default_fonts"] }
egui_extras  = { version = "0.36", features = ["image"] }
image        = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

# Native file dialogs for a running form's FileDropZone click-to-browse path
# (spec 039 T4) — opened asynchronously, same reason as the IDE's own copy in
# cobolt-ide/src/file_dialog.rs: a synchronous dialog nests the OS event loop,
# which aborts winit 0.30 with "tried to handle event while another event is
# currently being handled".
rfd      = "0.14"
pollster = "0.3"
