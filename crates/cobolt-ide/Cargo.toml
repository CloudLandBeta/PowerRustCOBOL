[package]
name        = "cobolt-ide"
description = "Cobolt IDE — egui-based COBOL development environment"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "cobolt-ide"
path = "src/main.rs"

[dependencies]
# Core runtime pipeline
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-ast      = { path = "../cobolt-ast" }
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
cobolt-runtime  = { path = "../cobolt-runtime" }
cobolt-stdlib   = { path = "../cobolt-stdlib" }

# Form designer
cobolt-forms    = { path = "../cobolt-forms", features = ["render"] }
cobolt-codegen  = { path = "../cobolt-codegen" }
cobolt-indexed  = { path = "../cobolt-indexed" }

# Animator widget — animated-image decoding + playback
cobolt-media    = { path = "../cobolt-media" }

# Phase 11 — binary compiler
cobolt-compiler = { path = "../cobolt-compiler" }

# UI framework
egui       = "0.36"
eframe     = { version = "0.36", features = ["default_fonts"] }
egui_extras = { version = "0.36", features = ["image"] }
# Low-level GL access for the offscreen rounded-corner clip (spec 017): captures
# the real backdrop behind a rounded container and re-blits it through a rounded
# mask, so translucent surfaces stop bleeding at the corners. Version tracks eframe's.
egui_glow  = "0.36"
# Agent access (spec 027 R3): serves the egui inspection protocol on localhost
# so MCP clients (via the official egui-mcp bridge) and the in-IDE agents can
# see and drive the IDE. Never linked by rcrun / packaged apps (R4).
egui_inspection = { version = "0.36", features = ["plugin"] }

image       = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "avif"] }

# System font enumeration (Font property dropdown)
fontdb = "0.23"

# Native file dialogs (opened asynchronously — a synchronous dialog nests the OS
# event loop, which aborts winit 0.30 with "tried to handle event while another
# event is currently being handled").
rfd = "0.14"
pollster = "0.3"

# Project packaging
zip = { version = "2", default-features = false, features = ["deflate"] }  # no defaults: bzip2/lzma/zstd are C libraries we never use

# Serialization (project files)
serde       = { workspace = true }
serde_json  = { workspace = true }
# Prompt revision stamps (agents_db): identifies a prompt file the IDE wrote
# itself, so shipped corrections reach it while a developer's edits are kept.
sha2        = { workspace = true }
bincode     = { workspace = true }
toml        = { workspace = true }

# AI assistant — optional cloud LLM for the COBOL code editor.
cobolt-agents = { path = "../cobolt-agents" }
schemars = "1"
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

# Data structures
indexmap    = { workspace = true }

# Run Form inspector — process/system metrics (CPU%, RSS, child processes)
sysinfo     = { workspace = true }

# Logging
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }

# For random quote selection on the welcome screen
rand = "0.8"
egui_commonmark = "0.25"
pulldown-cmark = { version = "0.12", default-features = false }
include_dir = "0.7"
mermaid-rs-renderer = "0.2"
resvg = "0.46"
genpdf = { version = "0.2", features = ["images"] }
dirs = "5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Syntax highlighting (optional — can be feature-gated later)
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
# Test-only: the roundtrip tests pin behaviour on the ONE shared control-state
# type (spec 042 R2). The IDE itself is not a form host and takes no runtime
# dependency on it — Run Form talks to it through the rcrun child process.
cobolt-form-host = { path = "../cobolt-form-host" }
