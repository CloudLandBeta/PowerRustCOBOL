# ─────────────────────────────────────────────────────────────────────────────
#  The AWS route table (spec 078 R14–R17)
# ─────────────────────────────────────────────────────────────────────────────
#
# Which MCP server serves each AWS control operation, as DATA. No `.rs` file
# names a server, a tool or a launch command (R15): moving a service to a new
# server is an edit here and a fixture re-record, not a code change.
#
# [servers.<id>]
#   transport       "stdio" (default: a child process spoken to over its
#                   stdin and stdout) or "https" (MCP streamable HTTP, every
#                   request signed with SigV4 by the runtime: no program).
#   command, args   stdio: how to start it. Versions are PINNED (`pkg@x.y.z`):
#                   a new server release must not silently change a built
#                   application.
#   url, service, signing_region, metadata
#                   https: the endpoint (https:// only, or http:// to
#                   localhost for a test), the SigV4 service name, the region
#                   signed for, and the values sent in `_meta` (placeholders
#                   allowed in url, service, signing_region and metadata).
#   env             the server's own variables (placeholders allowed).
#   readonly_args   added while no control on the connection allows writes.
#   write_args      added when one does (the server restarts to take them).
#   protocol        "handshake" (default) or "stateless".
#
# [ops."<ControlType>.<Method>"]
#   server          a server id — or a placeholder (`AwsMcp` names its own).
#   tool            the tool to call (placeholders allowed).
#   input           the tool's arguments: a table whose string leaves are
#                   expanded; a leaf that is exactly one `|json` placeholder
#                   becomes that JSON value.
#   mutating        true: refused while `AllowWrite` is off (R25).
#                   "by-tool": decided by the tool's `readOnlyHint` (R26).
#   result          property = extractor.
#   rows            how the answer becomes the control's rows (GetRow,
#                   GetField, RowCount); without it, rows are ResultJson when
#                   that is a JSON array:
#                     from     an extractor giving an array (a row per item),
#                              an object (a row per entry) or, with columns,
#                              an array of arrays
#                     columns  a pointer to the column names, for array rows
#                     fields   Field = pointer into the row; `/a|/b` takes the
#                              first present; `$key` is an object entry's key
#                     where    pointer = template: keep the rows whose value
#                              there equals it (an empty template keeps all)
#   fail            an answer that reports failure in its own data:
#                     when     an extractor; failed when it gives `equals`,
#                              or (without `equals`) anything at all
#                     text     an extractor giving the failure's text
#   event           the control's own completion event, raised before
#                   onComplete (R19).
#
# Placeholders:  {arg:N}  the N-th COBOL argument (1-based)
#                {prop:Name}  a property of the control
#                {Connection.Field}  a field of the control's AWS connection
#                {now}   the moment of the call, whole seconds since 1970 (UTC)
#   followed by filters, applied left to right:
#                |json   parse as JSON (an invalid one is an error naming the
#                        argument, R21); `|json:<literal>` parses <literal>
#                        when the value is empty
#                |or:<template>  the template, when the value is empty — an
#                        argument not passed is the property the designer set
#                |opt    an empty value leaves its input key out altogether
#                |int    a whole number
#                |quote  a JSON string literal, quotes included
#                |sql_read  refused, nothing sent, unless the text is one SQL
#                        statement that only reads (SELECT, WITH, SHOW, DESCRIBE,
#                        EXPLAIN, VALUES)
#                |obj:<key>  the JSON object {"<key>": value}
#                |text   a JSON value as its text (a tool that takes JSON
#                        inside a string)
#                |strip:<text>  remove a leading <text> when present
#                |ident  [^A-Za-z0-9_] -> `_`, and a leading `_` before a digit
#
# Extractors:    $text        every text block, joined
#                $isError     "1" when the tool reported an error, else "0"
#                $json:/ptr   a JSON Pointer into the structured result (or
#                             the text read as JSON — the whole text, else its
#                             last block that is JSON); `$json:` is the whole;
#                             `/a|/b` takes the first present
#                $jsonseq:    a text of JSON values one after another, as an
#                             array
#                $after:m1|m2 the text after the first marker found; "" if none

# ── The AWS Labs servers — started with uvx, used by NO control operation ───
# Until 1.91.210 the Lambda, Knowledge Base, AgentCore, Agent Memory, S3 Tables
# and Glue operations went to these five programs, so an application needed
# `uvx` (and Python) on every machine it ran on. They now go to the hosted AWS
# MCP Server below, like every other AWS control (operator, 2026-10-18: "all
# the examples without uvx"). The servers stay defined for `AwsMcp`, whose
# `ServerId` may name one of them on purpose.
#
# Lambda — awslabs.lambda-tool-mcp-server 2.1.1 (Python ≥ 3.10).
[servers.lambda]
command       = "uvx"
args          = ["awslabs.lambda-tool-mcp-server@2.1.1"]
env           = { FUNCTION_PREFIX = "{Connection.FunctionPrefix}", FUNCTION_LIST = "{Connection.FunctionList}" }
readonly_args = []
write_args    = []
protocol      = "handshake"

# Bedrock Knowledge Bases — awslabs.bedrock-kb-retrieval-mcp-server 1.1.2.
[servers.bedrock-kb]
command  = "uvx"
args     = ["awslabs.bedrock-kb-retrieval-mcp-server@1.1.2"]
protocol = "handshake"

# Bedrock AgentCore — awslabs.amazon-bedrock-agentcore-mcp-server 0.2.1.
[servers.agentcore]
command  = "uvx"
args     = ["awslabs.amazon-bedrock-agentcore-mcp-server@0.2.1"]
env      = { AGENTCORE_ENABLE_TOOLS = "runtime,memory" }
protocol = "handshake"

# S3 Tables — awslabs.s3-tables-mcp-server 0.1.1 (Python ≥ 3.11).
[servers.s3tables]
command       = "uvx"
args          = ["--python", ">=3.11", "awslabs.s3-tables-mcp-server@0.1.1"]
readonly_args = []
write_args    = ["--allow-write"]
protocol      = "handshake"

# Glue — awslabs.aws-dataprocessing-mcp-server 0.2.2.
[servers.dataprocessing]
command       = "uvx"
args          = ["awslabs.aws-dataprocessing-mcp-server@0.2.2"]
readonly_args = []
write_args    = ["--allow-write"]
protocol      = "handshake"

# ── The hosted AWS MCP Server — reached by the runtime itself (spec 103) ────
# AWS's own MCP service. No program is started and nothing needs installing: the
# runtime speaks MCP over HTTPS and signs every request with SigV4, with the keys
# the program set for the connection (AWS-SET-CREDENTIALS) or the sign-in the
# connection's profile names (`aws login`, SSO, the shared files). Its one general tool is
# `aws___run_script`: a Python script run in AWS's sandbox, which reaches AWS
# with `await call_boto3(service_name, operation_name, params, region_name)`
# and answers the envelope {status, stdout, stderr, return_value} as text.
# (`aws___call_aws` was removed on 2026-08-31.)
#
# Every script below is shipped with the product. A COBOL value enters one
# ONLY as a quoted literal (`|quote`), a number (`|int`) or a file's bytes as
# base64 (`|filebase64`, `|source`) — never as script text; a test checks
# every placeholder of every template (R25, plan §4).
#
# There is no server-side read-only mode to ask for: it would drop every tool not
# marked read-only, `aws___run_script` among them. Writes are refused here, by
# each operation's `mutating`, and by the profile's own IAM policy.
#
# The service is hosted in eight regions; the endpoint is us-east-1's, and
# the connection's region goes in as the default and on every call (`_meta`).
# `service` and `signing_region` are what the requests are signed for.
[servers.hosted]
transport      = "https"
url            = "https://aws-mcp.us-east-1.api.aws/mcp"
service        = "aws-mcp"
signing_region = "us-east-1"
metadata       = { AWS_REGION = "{Connection.Region|or:us-east-1}" }
protocol       = "handshake"

# Product-shipped Python, pasted into a template by `{snippet:name}`. A
# snippet holds no brace: it is pasted before placeholders are expanded.
#
# AWS's sandbox validates a script before it runs it and refuses the whole
# script for one forbidden name (operator's report, 2026-10-17): it imports
# `json` and nothing else (`base64` is refused), and it refuses `getattr()` and
# any `__dunder__` attribute. A test holds every template to that. So base64 is
# done here with built-ins only: `_b64d`/`_b64e` turn each character into its
# six bits (`str.translate`) and read them as one integer, and each 12 bits of
# hex into two characters — C-speed steps, in 3 KB pieces, so an object of a
# few MB costs a fraction of a second and no large temporary.
[snippets]
prelude = '''
import json
def _j(o):
    return json.loads(json.dumps(o, default=str))
_A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
_X = '0123456789abcdef'
def _six(i):
    return ''.join('1' if (i >> (5 - k)) & 1 else '0' for k in range(6))
_D = dict((ord(c), _six(i)) for i, c in enumerate(_A))
_D[ord('-')] = _D[ord('+')]
_D[ord('_')] = _D[ord('/')]
_E = dict((_X[i >> 8] + _X[(i >> 4) & 15] + _X[i & 15], _A[i >> 6] + _A[i & 63]) for i in range(4096))
def _b64d(s):
    s = ''.join(str(s).split()).rstrip('=')
    out = []
    for i in range(0, len(s), 4096):
        c = s[i:i + 4096]
        n = len(c) * 6 // 8
        if n:
            out.append(int(c.translate(_D)[:n * 8], 2).to_bytes(n, 'big'))
    return b''.join(out)
def _b64e(b):
    b = bytes(b)
    out = []
    for i in range(0, len(b), 3072):
        c = b[i:i + 3072]
        r = len(c) % 3
        h = (c + bytes(3 - r) if r else c).hex()
        s = ''.join([_E[h[j:j + 3]] for j in range(0, len(h), 3)])
        out.append(s[:len(s) - (3 - r)] + '=' * (3 - r) if r else s)
    return ''.join(out)
def _bytes(x):
    if hasattr(x, 'read'):
        x = x.read()
    if isinstance(x, str):
        return _b64d(x)
    return bytes(x)
def _source(s):
    if s.startswith('b64:'):
        return dict(Bytes=_b64d(s[4:]))
    b, k = s[5:].split('/', 1)
    return dict(S3Object=dict(Bucket=b, Name=k))
'''
dynamodb = '''
def _plain(v):
    if isinstance(v, dict) and len(v) == 1:
        k, x = list(v.items())[0]
        if k in ('S', 'B', 'BOOL'):
            return x
        if k == 'N':
            return float(x) if ('.' in x or 'e' in x or 'E' in x) else int(x)
        if k == 'NULL':
            return None
        if k == 'L':
            return [_plain(i) for i in x]
        if k == 'M':
            return dict((a, _plain(b)) for a, b in x.items())
        if k in ('SS', 'NS', 'BS'):
            return [_plain(dict(S=i)) if k != 'NS' else _plain(dict(N=i)) for i in x]
    return v
def _typed(v):
    if v is None:
        return dict(NULL=True)
    if isinstance(v, bool):
        return dict(BOOL=v)
    if isinstance(v, (int, float)):
        return dict(N=str(v))
    if isinstance(v, str):
        return dict(S=v)
    if isinstance(v, list):
        return dict(L=[_typed(i) for i in v])
    if isinstance(v, dict):
        return dict(M=dict((a, _typed(b)) for a, b in v.items()))
    return dict(S=str(v))
def _item(o):
    return dict((a, _typed(b)) for a, b in o.items())
def _row(o):
    return dict((a, _plain(b)) for a, b in o.items())
'''
# A date as ISO 8601 text (`2026-10-01T09:30:00+00:00`): a datetime by its
# own isoformat, and a date already written as text with a space between day
# and time (what `str` of a datetime gives) with a `T` there instead.
iso = '''
def _iso(x):
    if hasattr(x, 'isoformat'):
        return x.isoformat()
    s = str(x)
    if len(s) > 10 and s[4] == '-' and s[10] == ' ':
        return s[:10] + 'T' + s[11:]
    return s
'''
# The functions an AwsLambda connection offers (its FunctionPrefix and
# FunctionList), and a name given with or without the prefix.
lambda = '''
def _names(s):
    return [x for x in str(s).replace(',', ' ').split() if x]
def _offered(n, p, listed):
    n = str(n).strip()
    p = str(p).strip()
    allow = _names(listed)
    if not n:
        raise ValueError('no function to invoke: name one, or set FunctionName')
    if p and not n.startswith(p) and n not in allow:
        n = p + n
    if (p or allow) and not (p and n.startswith(p)) and n not in allow:
        raise ValueError('the function "' + n + '" is not one this connection offers (its FunctionPrefix and FunctionList)')
    return n
'''
# Amazon Athena over an S3 table bucket (AwsS3Tables.Query, AppendRows). A
# statement is waited for by asking after it, since the sandbox has no sleep;
# the control's TimeoutMs bounds the wait. Every value an INSERT writes is a
# quoted literal cast to its column's type, every name a quoted identifier.
athena = '''
_DONE = ('SUCCEEDED', 'FAILED', 'CANCELLED')
_POLLS = 3000
def _catalog(arn):
    return 's3tablescatalog/' + str(arn).split('/')[-1]
def _finished(st):
    s = st.get('State', '')
    if s != 'SUCCEEDED':
        raise ValueError('Athena: the statement ' + (s.lower() if s else 'did not finish') + '. ' + str(st.get('StateChangeReason', '') or ''))
def _ident(name):
    return '"' + str(name).replace('"', '""') + '"'
def _literal(v, ty):
    if v is None:
        return 'NULL'
    if isinstance(v, bool):
        s = 'TRUE' if v else 'FALSE'
    elif isinstance(v, (int, float)):
        s = repr(v)
    else:
        s = "'" + (v if isinstance(v, str) else json.dumps(v)).replace("'", "''") + "'"
    return 'CAST(' + s + ' AS ' + ty + ')' if ty else s
def _insert(table, names, rows, types):
    cols = ', '.join([_ident(k) for k in names])
    vals = ', '.join(['(' + ', '.join([_literal(x.get(k), types.get(str(k).lower(), '')) for k in names]) + ')' for x in rows])
    return 'INSERT INTO ' + _ident(table) + ' (' + cols + ') VALUES ' + vals
'''

# ── AwsDynamoDB ── items in and out as PLAIN JSON: {"id": 42, "name": "Ana"},
# never DynamoDB's typed {"N": "42"} form — the template converts both ways.
[ops."AwsDynamoDB.GetItem"]
event    = "onItem"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResponseBody = "$json:/return_value/Items/0", Found = "$json:/return_value/Found", ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Items" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.GetItem".input]
code = '''{snippet:prelude}{snippet:dynamodb}
r = await call_boto3(service_name='dynamodb', operation_name='GetItem', params=dict(TableName={prop:TableName|quote}, Key=_item(json.loads({arg:1|json|text|quote}))), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Items=([_row(r['Item'])] if 'Item' in r else []), Found=('1' if 'Item' in r else '0')))
result'''

