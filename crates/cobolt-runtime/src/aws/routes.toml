# AnalyzeDocument: the form fields (key/value pairs) and the table cells, one
# row each, `Kind` telling them apart.
[ops."AwsTextract.AnalyzeDocument"]
event    = "onDocumentAnalyzed"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Rows", fields = { Kind = "/Kind", Key = "/Key", Value = "/Value", Table = "/Table", Row = "/Row", Column = "/Column", Confidence = "/Confidence" } }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsTextract.AnalyzeDocument".input]
code = '''{snippet:prelude}
s = _source({arg:1|source|quote})
d = dict(Bytes=s['Bytes']) if 'Bytes' in s else dict(S3Object=s['S3Object'])
r = await call_boto3(service_name='textract', operation_name='AnalyzeDocument', params=dict(Document=d, FeatureTypes=['FORMS', 'TABLES']), region_name={Connection.Region|or:us-east-1|quote})
blocks = r.get('Blocks', [])
by_id = dict((b['Id'], b) for b in blocks)
def kids(b, kind):
    out = []
    for rel in b.get('Relationships', []):
        if rel.get('Type') == kind:
            out.extend(by_id[i] for i in rel.get('Ids', []) if i in by_id)
    return out
def text(b):
    words = []
    for c in kids(b, 'CHILD'):
        if c.get('BlockType') == 'WORD':
            words.append(c.get('Text', ''))
        elif c.get('BlockType') == 'SELECTION_ELEMENT':
            words.append('[X]' if c.get('SelectionStatus') == 'SELECTED' else '[ ]')
    return ' '.join(words)
rows = []
for b in blocks:
    if b.get('BlockType') == 'KEY_VALUE_SET' and 'KEY' in b.get('EntityTypes', []):
        v = kids(b, 'VALUE')
        rows.append(dict(Kind='FIELD', Key=text(b), Value=(text(v[0]) if v else ''), Table=0, Row=0, Column=0, Confidence=b.get('Confidence', 0)))
t = 0
for b in blocks:
    if b.get('BlockType') == 'TABLE':
        t += 1
        for c in kids(b, 'CHILD'):
            if c.get('BlockType') == 'CELL':
                rows.append(dict(Kind='CELL', Key='', Value=text(c), Table=t, Row=c.get('RowIndex', 0), Column=c.get('ColumnIndex', 0), Confidence=c.get('Confidence', 0)))
result = _j(dict(Rows=rows))
result'''

