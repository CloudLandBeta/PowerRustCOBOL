# ─────────────────────────────────────────────────────────────────────────────
#  The AWS route table (spec 078 R14–R17)
# ─────────────────────────────────────────────────────────────────────────────
#
# Which MCP server serves each AWS control operation, as DATA. No `.rs` file
# names a server, a tool or a launch command (R15): moving a service to a new
# server is an edit here and a fixture re-record, not a code change.
#
# [servers.<id>]
#   command, args   how to start it. Versions are PINNED (`pkg@x.y.z`): a new
#                   server release must not silently change a built
#                   application.
#   env             the server's own variables (placeholders allowed).
#   readonly_args   added while no control on the connection allows writes.
#   write_args      added when one does (the server restarts to take them).
#   protocol        "handshake" (default) or "stateless".
#
# [ops."<ControlType>.<Method>"]
#   server          a server id — or a placeholder (`AwsMcp` names its own).
#   tool            the tool to call (placeholders allowed).
#   input           the tool's arguments: a table whose string leaves are
#                   expanded; a leaf that is exactly one `|json` placeholder
#                   becomes that JSON value.
#   mutating        true: refused while `AllowWrite` is off (R25).
#                   "by-tool": decided by the tool's `readOnlyHint` (R26).
#   result          property = extractor.
#   rows            how the answer becomes the control's rows (GetRow,
#                   GetField, RowCount); without it, rows are ResultJson when
#                   that is a JSON array:
#                     from     an extractor giving an array (a row per item),
#                              an object (a row per entry) or, with columns,
#                              an array of arrays
#                     columns  a pointer to the column names, for array rows
#                     fields   Field = pointer into the row; `/a|/b` takes the
#                              first present; `$key` is an object entry's key
#                     where    pointer = template: keep the rows whose value
#                              there equals it (an empty template keeps all)
#   fail            an answer that reports failure in its own data:
#                     when     an extractor; failed when it gives `equals`,
#                              or (without `equals`) anything at all
#                     text     an extractor giving the failure's text
#   event           the control's own completion event, raised before
#                   onComplete (R19).
#
# Placeholders:  {arg:N}  the N-th COBOL argument (1-based)
#                {prop:Name}  a property of the control
#                {Connection.Field}  a field of the control's AWS connection
#   followed by filters, applied left to right:
#                |json   parse as JSON (an invalid one is an error naming the
#                        argument, R21); `|json:<literal>` parses <literal>
#                        when the value is empty
#                |or:<template>  the template, when the value is empty — an
#                        argument not passed is the property the designer set
#                |opt    an empty value leaves its input key out altogether
#                |int    a whole number
#                |quote  a JSON string literal, quotes included
#                |obj:<key>  the JSON object {"<key>": value}
#                |text   a JSON value as its text (a tool that takes JSON
#                        inside a string)
#                |strip:<text>  remove a leading <text> when present
#                |ident  [^A-Za-z0-9_] -> `_`, and a leading `_` before a digit
#
# Extractors:    $text        every text block, joined
#                $isError     "1" when the tool reported an error, else "0"
#                $json:/ptr   a JSON Pointer into the structured result (or
#                             the text read as JSON — the whole text, else its
#                             last block that is JSON); `$json:` is the whole;
#                             `/a|/b` takes the first present
#                $jsonseq:    a text of JSON values one after another, as an
#                             array
#                $after:m1|m2 the text after the first marker found; "" if none

# ── Lambda — awslabs.lambda-tool-mcp-server 2.1.1 (Python ≥ 3.10) ───────────
# Each selected function is a tool named after it: the connection's prefix
# removed, then sanitised. The payload is the tool's `parameters` argument.
# The server reports a function error in TEXT ("Function <f> returned with
# error: Unhandled"), not as a tool error, so FunctionError reads it there.
[servers.lambda]
command       = "uvx"
args          = ["awslabs.lambda-tool-mcp-server@2.1.1"]
env           = { FUNCTION_PREFIX = "{Connection.FunctionPrefix}", FUNCTION_LIST = "{Connection.FunctionList}" }
readonly_args = []
write_args    = []
protocol      = "handshake"

[ops."AwsLambda.Invoke"]
event    = "onInvoked"
server   = "lambda"
tool     = "{arg:1|or:{prop:FunctionName}|strip:{Connection.FunctionPrefix}|ident}"
input    = { parameters = "{arg:2|json:{}}" }
mutating = true
result   = { ResponseBody = "$after:returned: |returned payload: ", FunctionError = "$after:returned with error: " }

[ops."AwsLambda.ListFunctions"]
event    = "onFunctionsListed"
server   = "lambda"
tool     = "$list"
mutating = false

# ── Bedrock Knowledge Bases — awslabs.bedrock-kb-retrieval-mcp-server 1.1.2 ─
# (Python ≥ 3.10.) Lists only the knowledge bases tagged
# `mcp-multirag-kb = true` (the server's KB_INCLUSION_TAG_KEY default). A
# query answers one JSON object per passage, one after another — not an
# array — and leaves image passages out.
[servers.bedrock-kb]
command  = "uvx"
args     = ["awslabs.bedrock-kb-retrieval-mcp-server@1.1.2"]
protocol = "handshake"

[ops."AwsKnowledgeBase.Query"]
event    = "onQueried"
server   = "bedrock-kb"
tool     = "QueryKnowledgeBases"
input    = { knowledge_base_id = "{arg:1|or:{prop:KnowledgeBaseId}}", query = "{arg:2}", number_of_results = "{prop:MaxResults|opt|int}" }
mutating = false
result   = { ResponseBody = "$text" }
rows     = { from = "$jsonseq:", fields = { Text = "/content/text", Source = "/location/s3Location/uri|/location/webLocation/url|/location/confluenceLocation/url|/location/salesforceLocation/url|/location/sharePointLocation/url|/location/customDocumentLocation/id|/location/type", Score = "/score" } }

[ops."AwsKnowledgeBase.ListKnowledgeBases"]
event    = "onKnowledgeBasesListed"
server   = "bedrock-kb"
tool     = "ListKnowledgeBases"
input    = {}
mutating = false
result   = { ResultJson = "$json:" }
rows     = { from = "$json:", fields = { Id = "$key", Name = "/name", Description = "/description", Type = "/type" } }

# ── Bedrock AgentCore — awslabs.amazon-bedrock-agentcore-mcp-server 0.2.1 ───
# (Python ≥ 3.10.) The server has no write switch, and enables its tools by
# SERVICE, not one by one: `runtime,memory` is the narrowest set holding the
# three tools routed here, and it also registers their lifecycle tools
# (create, delete …). AwsMcp reaches those only with AllowWrite on, since
# none is marked read-only. Failures come back as data: {"status": "error"}.
[servers.agentcore]
command  = "uvx"
args     = ["awslabs.amazon-bedrock-agentcore-mcp-server@0.2.1"]
env      = { AGENTCORE_ENABLE_TOOLS = "runtime,memory" }
protocol = "handshake"

# The payload is JSON inside a string: {"prompt": "<text>"}, the shape an
# AgentCore agent built from the starter toolkit reads. A session id, when
# given, is 33–256 characters; without one the runtime starts a session and
# SessionId receives it, so the next Invoke continues it.
[ops."AwsAgentCore.Invoke"]
event    = "onInvoked"
server   = "agentcore"
tool     = "invoke_agent_runtime"
input    = { agent_runtime_arn = "{arg:1|or:{prop:RuntimeArn}}", payload = "{arg:2|obj:prompt|text}", runtime_session_id = "{arg:3|or:{prop:SessionId}|opt}" }
mutating = true
result   = { ResponseBody = "$json:/response_body", SessionId = "$json:/runtime_session_id", ResultJson = "$json:" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/message" }

[ops."AwsAgentMemory.RecordEvent"]
event    = "onEventRecorded"
server   = "agentcore"
tool     = "memory_create_event"
input    = { memory_id = "{arg:1|or:{prop:MemoryId}}", actor_id = "{arg:2|or:{prop:ActorId}}", session_id = "{arg:3|or:{prop:SessionId}|opt}", payload = [{ conversational = { content = { text = "{arg:4}" }, role = "{arg:5|or:USER}" } }] }
mutating = true
result   = { EventId = "$json:/event/eventId", ResultJson = "$json:" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/message" }

[ops."AwsAgentMemory.Retrieve"]
event    = "onRetrieved"
server   = "agentcore"
tool     = "memory_retrieve_records"
input    = { memory_id = "{arg:1|or:{prop:MemoryId}}", namespace = "{arg:2|or:{prop:Namespace}}", search_query = "{arg:3}", top_k = "{prop:TopK|opt|int}" }
mutating = false
result   = { ResultJson = "$json:" }
rows     = { from = "$json:/memory_records", fields = { Id = "/memoryRecordId", Text = "/content/text", Score = "/score", CreatedAt = "/createdAt" } }
fail     = { when = "$json:/status", equals = "error", text = "$json:/message" }

# ── S3 Tables — awslabs.s3-tables-mcp-server 0.1.1 ──────────────────────────
# Needs Python ≥ 3.11 (its pyproject says so; its README's 3.10 is wrong), so
# uvx is told. Write tools stay LISTED in read-only mode and refuse when
# called. `query_database` itself refuses any statement that writes. The
# Iceberg REST endpoint is the region's.
[servers.s3tables]
command       = "uvx"
args          = ["--python", ">=3.11", "awslabs.s3-tables-mcp-server@0.1.1"]
readonly_args = []
write_args    = ["--allow-write"]
protocol      = "handshake"

# Every table in the region; `where` keeps one namespace when one is named.
[ops."AwsS3Tables.ListTables"]
event    = "onTablesListed"
server   = "s3tables"
tool     = "list_tables"
input    = { region_name = "{Connection.Region|opt}" }
mutating = false
result   = { ResultJson = "$json:" }
rows     = { from = "$json:/tables", fields = { Namespace = "/namespace/0", Name = "/name", TableArn = "/table_arn", Type = "/type", ModifiedAt = "/modified_at" }, where = { "/namespace/0" = "{arg:1|or:{prop:Namespace}}" } }
fail     = { when = "$json:/error", text = "$json:/error" }

[ops."AwsS3Tables.Query"]
event    = "onQueried"
server   = "s3tables"
tool     = "query_database"
input    = { warehouse = "{prop:TableBucketArn}", region = "{Connection.Region}", namespace = "{prop:Namespace}", uri = "https://s3tables.{Connection.Region}.amazonaws.com/iceberg", query = "{arg:1}" }
mutating = false
result   = { ResultJson = "$json:" }
rows     = { from = "$json:/rows", columns = "/columns" }

[ops."AwsS3Tables.AppendRows"]
event    = "onRowsAppended"
server   = "s3tables"
tool     = "append_rows_to_table"
input    = { warehouse = "{prop:TableBucketArn}", region = "{Connection.Region}", namespace = "{prop:Namespace}", uri = "https://s3tables.{Connection.Region}.amazonaws.com/iceberg", table_name = "{arg:1|or:{prop:TableName}}", rows = "{arg:2|json}" }
mutating = true
result   = { RowsAppended = "$json:/rows_appended", ResultJson = "$json:" }

# ── Glue — awslabs.aws-dataprocessing-mcp-server 0.2.2 ──────────────────────
# (Python ≥ 3.10.) One tool per resource, the operation an argument. Each
# answer is two text blocks — a message, then the data as JSON. Without
# --allow-sensitive-data-access the server leaves a run's Arguments,
# ErrorMessage and StateDetail out; its state is always there.
[servers.dataprocessing]
command       = "uvx"
args          = ["awslabs.aws-dataprocessing-mcp-server@0.2.2"]
readonly_args = []
write_args    = ["--allow-write"]
protocol      = "handshake"

[ops."AwsGlue.StartJobRun"]
event    = "onJobStarted"
server   = "dataprocessing"
tool     = "manage_aws_glue_jobs"
input    = { operation = "start-job-run", job_name = "{arg:1|or:{prop:JobName}}", job_arguments = "{arg:2|opt|json}" }
mutating = true
result   = { JobRunId = "$json:/job_run_id", ResponseBody = "$text", ResultJson = "$json:" }

[ops."AwsGlue.GetJobRun"]
event    = "onJobRun"
server   = "dataprocessing"
tool     = "manage_aws_glue_jobs"
input    = { operation = "get-job-run", job_name = "{arg:1|or:{prop:JobName}}", job_run_id = "{arg:2|or:{prop:JobRunId}}" }
mutating = false
result   = { State = "$json:/job_run_details/JobRunState", ResponseBody = "$text", ResultJson = "$json:" }

[ops."AwsGlue.StartCrawler"]
event    = "onCrawlerStarted"
server   = "dataprocessing"
tool     = "manage_aws_glue_crawlers"
input    = { operation = "start-crawler", crawler_name = "{arg:1|or:{prop:CrawlerName}}" }
mutating = true
result   = { ResponseBody = "$text", ResultJson = "$json:" }

[ops."AwsGlue.GetTableSchema"]
event    = "onTableSchema"
server   = "dataprocessing"
tool     = "manage_aws_glue_tables"
input    = { operation = "get-table", database_name = "{arg:1|or:{prop:DatabaseName}}", table_name = "{arg:2|or:{prop:TableName}}" }
mutating = false
result   = { ResponseBody = "$text", ResultJson = "$json:" }
rows     = { from = "$json:/storage_descriptor/Columns|/table_definition/StorageDescriptor/Columns", fields = { Name = "/Name", Type = "/Type", Comment = "/Comment" } }

# ── The hosted AWS MCP Server — mcp-proxy-for-aws 1.7.0 ─────────────────────
# (Python ≥ 3.10.) AWS's own MCP service, reached through AWS's proxy, which
# signs every request with the connection's profile. Its one general tool is
# `aws___run_script`: a Python script run in AWS's sandbox, which reaches AWS
# with `await call_boto3(service_name, operation_name, params, region_name)`
# and answers the envelope {status, stdout, stderr, return_value} as text.
# (`aws___call_aws` was removed on 2026-08-31.)
#
# Every script below is shipped with the product. A COBOL value enters one
# ONLY as a quoted literal (`|quote`), a number (`|int`) or a file's bytes as
# base64 (`|filebase64`, `|source`) — never as script text; a test checks
# every placeholder of every template (R25, plan §4).
#
# Not `--read-only`: the proxy's read-only mode drops every tool not marked
# read-only, `aws___run_script` among them. Writes are refused here, by each
# operation's `mutating`, and by the profile's own IAM policy.
#
# The service is hosted in eight regions; the endpoint is us-east-1's, and
# the connection's region goes in as the default and on every call.
[servers.hosted]
command  = "uvx"
args     = ["mcp-proxy-for-aws@1.7.0", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "AWS_REGION={Connection.Region|or:us-east-1}"]
protocol = "handshake"

# Product-shipped Python, pasted into a template by `{snippet:name}`. A
# snippet holds no brace: it is pasted before placeholders are expanded.
[snippets]
prelude = '''
import json, base64
def _j(o):
    return json.loads(json.dumps(o, default=str))
def _bytes(x):
    if hasattr(x, 'read'):
        x = x.read()
    if isinstance(x, str):
        return base64.b64decode(x)
    return bytes(x)
def _source(s):
    if s.startswith('b64:'):
        return dict(Bytes=base64.b64decode(s[4:]))
    b, k = s[5:].split('/', 1)
    return dict(S3Object=dict(Bucket=b, Name=k))
'''
dynamodb = '''
def _plain(v):
    if isinstance(v, dict) and len(v) == 1:
        k, x = list(v.items())[0]
        if k in ('S', 'B', 'BOOL'):
            return x
        if k == 'N':
            return float(x) if ('.' in x or 'e' in x or 'E' in x) else int(x)
        if k == 'NULL':
            return None
        if k == 'L':
            return [_plain(i) for i in x]
        if k == 'M':
            return dict((a, _plain(b)) for a, b in x.items())
        if k in ('SS', 'NS', 'BS'):
            return [_plain(dict(S=i)) if k != 'NS' else _plain(dict(N=i)) for i in x]
    return v
def _typed(v):
    if v is None:
        return dict(NULL=True)
    if isinstance(v, bool):
        return dict(BOOL=v)
    if isinstance(v, (int, float)):
        return dict(N=str(v))
    if isinstance(v, str):
        return dict(S=v)
    if isinstance(v, list):
        return dict(L=[_typed(i) for i in v])
    if isinstance(v, dict):
        return dict(M=dict((a, _typed(b)) for a, b in v.items()))
    return dict(S=str(v))
def _item(o):
    return dict((a, _typed(b)) for a, b in o.items())
def _row(o):
    return dict((a, _plain(b)) for a, b in o.items())
'''

# ── AwsDynamoDB ── items in and out as PLAIN JSON: {"id": 42, "name": "Ana"},
# never DynamoDB's typed {"N": "42"} form — the template converts both ways.
[ops."AwsDynamoDB.GetItem"]
event    = "onItem"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResponseBody = "$json:/return_value/Items/0", Found = "$json:/return_value/Found", ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Items" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.GetItem".input]
code = '''{snippet:prelude}{snippet:dynamodb}
r = await call_boto3(service_name='dynamodb', operation_name='GetItem', params=dict(TableName={prop:TableName|quote}, Key=_item(json.loads({arg:1|json|text|quote}))), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Items=([_row(r['Item'])] if 'Item' in r else []), Found=('1' if 'Item' in r else '0')))
result'''

[ops."AwsDynamoDB.Query"]
event    = "onQueried"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Items" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.Query".input]
code = '''{snippet:prelude}{snippet:dynamodb}
p = dict(TableName={prop:TableName|quote}, KeyConditionExpression={arg:1|quote}, ExpressionAttributeValues=_item(json.loads({arg:2|json|text|quote})), Limit={prop:Limit|or:100|int})
if {arg:3|or:{prop:IndexName}|quote}:
    p['IndexName'] = {arg:3|or:{prop:IndexName}|quote}
r = await call_boto3(service_name='dynamodb', operation_name='Query', params=p, region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Items=[_row(i) for i in r.get('Items', [])], Count=r.get('Count', 0)))
result'''

[ops."AwsDynamoDB.Scan"]
event    = "onScanned"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Items" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.Scan".input]
code = '''{snippet:prelude}{snippet:dynamodb}
r = await call_boto3(service_name='dynamodb', operation_name='Scan', params=dict(TableName={prop:TableName|quote}, Limit={arg:1|or:{prop:Limit}|or:100|int}), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Items=[_row(i) for i in r.get('Items', [])], Count=r.get('Count', 0)))
result'''

[ops."AwsDynamoDB.PutItem"]
event    = "onItemPut"
server   = "hosted"
tool     = "aws___run_script"
mutating = true
result   = { ResultJson = "$json:/return_value" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.PutItem".input]
code = '''{snippet:prelude}{snippet:dynamodb}
r = await call_boto3(service_name='dynamodb', operation_name='PutItem', params=dict(TableName={prop:TableName|quote}, Item=_item(json.loads({arg:1|json|text|quote}))), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Done='1'))
result'''

[ops."AwsDynamoDB.UpdateItem"]
event    = "onItemUpdated"
server   = "hosted"
tool     = "aws___run_script"
mutating = true
result   = { ResponseBody = "$json:/return_value/Items/0", ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Items" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.UpdateItem".input]
code = '''{snippet:prelude}{snippet:dynamodb}
r = await call_boto3(service_name='dynamodb', operation_name='UpdateItem', params=dict(TableName={prop:TableName|quote}, Key=_item(json.loads({arg:1|json|text|quote})), UpdateExpression={arg:2|quote}, ExpressionAttributeValues=_item(json.loads({arg:3|json|text|quote})), ReturnValues='ALL_NEW'), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Items=[_row(r.get('Attributes', dict()))]))
result'''

[ops."AwsDynamoDB.DeleteItem"]
event    = "onItemDeleted"
server   = "hosted"
tool     = "aws___run_script"
mutating = true
result   = { ResultJson = "$json:/return_value" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsDynamoDB.DeleteItem".input]
code = '''{snippet:prelude}{snippet:dynamodb}
r = await call_boto3(service_name='dynamodb', operation_name='DeleteItem', params=dict(TableName={prop:TableName|quote}, Key=_item(json.loads({arg:1|json|text|quote}))), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Done='1'))
result'''

# ── AwsS3 ── objects of the `Bucket`. GetObject suits objects up to a few MB:
# the body comes back inside the answer, base64-encoded.
[ops."AwsS3.List"]
event    = "onListed"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResultJson = "$json:/return_value" }
rows     = { from = "$json:/return_value/Contents", fields = { Key = "/Key", Size = "/Size", LastModified = "/LastModified" } }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsS3.List".input]
code = '''{snippet:prelude}
r = await call_boto3(service_name='s3', operation_name='ListObjectsV2', params=dict(Bucket={prop:Bucket|quote}, Prefix={arg:1|quote}, MaxKeys={prop:MaxKeys|or:1000|int}), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(Contents=r.get('Contents', [])))
result'''

[ops."AwsS3.GetObject"]
event    = "onObject"
server   = "hosted"
tool     = "aws___run_script"
mutating = false
result   = { ResponseBody = "$json:/return_value/Text", ContentType = "$json:/return_value/ContentType" }
save     = { path = "{arg:2}", from = "$json:/return_value/Base64", decode = "base64" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsS3.GetObject".input]
code = '''{snippet:prelude}
r = await call_boto3(service_name='s3', operation_name='GetObject', params=dict(Bucket={prop:Bucket|quote}, Key={arg:1|quote}), region_name={Connection.Region|or:us-east-1|quote})
b = _bytes(r.get('Body', b''))
result = _j(dict(Base64=base64.b64encode(b).decode(), Text=b.decode('utf-8', 'replace'), ContentType=r.get('ContentType', '')))
result'''

[ops."AwsS3.PutObject"]
event    = "onObjectPut"
server   = "hosted"
tool     = "aws___run_script"
mutating = true
result   = { ResultJson = "$json:/return_value" }
fail     = { when = "$json:/status", equals = "error", text = "$json:/error|/stderr" }
[ops."AwsS3.PutObject".input]
code = '''{snippet:prelude}
f = {arg:3|filebase64|quote}
body = base64.b64decode(f) if f else {arg:2|quote}.encode('utf-8')
r = await call_boto3(service_name='s3', operation_name='PutObject', params=dict(Bucket={prop:Bucket|quote}, Key={arg:1|quote}, Body=body), region_name={Connection.Region|or:us-east-1|quote})
result = _j(dict(ETag=r.get('ETag', '')))
result'''

[ops."AwsS3.DeleteObject"]
event    = "onObjectDeleted"
server   = "hosted"
