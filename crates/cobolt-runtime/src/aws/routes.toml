# ── AwsMcp.AwsCall ── one AWS API call by name (spec 092 R4), always on the
# hosted server, whatever `ServerId` says. The service is boto3's name for it
# (`cloudformation`, `dynamodb`, `s3`, `cognito-idp` — usually the AWS CLI's,
# but `s3` where the CLI says `s3api`), the operation the API's own CamelCase
# name, as every template above spells it (`DescribeStacks`, `CreateTable`), and
# the parameters a JSON object spelled as the API reference spells them
# (`{"StackName": "x"}`; empty is `{}`). All three enter the script as quoted
# literals only — the same rule as every hosted template — so a COBOL value
# can name a call but never write one.
#
# The script cannot know which operations only read, so every AwsCall needs
# AllowWrite. A failing call never answers empty: an error the API raised
# (botocore's ClientError, whose `response` carries Error.Code) or returned in
# its own answer comes back as Status "error" with "<Code>: <message>", and a
# failure the sandbox reports itself is caught by the same `fail`.
#
# The answer (ResponseMetadata removed, dates as ISO 8601) is ResponseBody and
# ResultJson. Rows: the items of its one list when it has exactly one
# (`Stacks`, `Buckets`); else, when its only member is an object, that object
# (`Table`, `TableDescription`); else the answer itself — one row either way.
[ops."AwsMcp.AwsCall"]
event    = "onAwsCalled"
server   = "hosted"
tool     = "aws___run_script"
mutating = true
result   = { ResponseBody = "$json:/return_value/Answer", ResultJson = "$json:/return_value/Answer" }
rows     = { from = "$json:/return_value/Rows" }
fail     = { when = "$json:/return_value/Status|/status", equals = "error", text = "$json:/return_value/Error|/error|/stderr" }
[ops."AwsMcp.AwsCall".input]
code = '''{snippet:prelude}{snippet:iso}
def _code(x):
    d = x
    if not isinstance(d, dict):
        try:
            d = x.response
        except Exception:
            d = None
    if isinstance(d, dict) and isinstance(d.get('Error'), dict):
        return str(d['Error'].get('Code', '')), str(d['Error'].get('Message', ''))
    return '', ''
try:
    r = await call_boto3(service_name={arg:1|quote}, operation_name={arg:2|quote}, params=json.loads({arg:3|json:{}|text|quote}), region_name={Connection.Region|or:us-east-1|quote})
    c, m = _code(r)
except Exception as x:
    r = dict()
    c, m = _code(x)
    if not c:
        s = str(x)
        c = s[s.find('(') + 1:s.find(')')] if s.startswith('An error occurred (') else 'Error'
        m = s
if c:
    result = _j(dict(Status='error', Error=c + ': ' + (m or c)))
else:
    a = json.loads(json.dumps(r, default=_iso))
    if isinstance(a, dict):
        a.pop('ResponseMetadata', None)
    k = [n for n in a if isinstance(a[n], list)] if isinstance(a, dict) else []
    if len(k) == 1:
        rows = a[k[0]]
    elif isinstance(a, dict) and len(a) == 1 and isinstance(list(a.values())[0], dict):
        rows = [list(a.values())[0]]
    else:
        rows = [a]
    result = _j(dict(Answer=a, Rows=[i if isinstance(i, dict) else dict(Value=i) for i in rows]))
result'''
