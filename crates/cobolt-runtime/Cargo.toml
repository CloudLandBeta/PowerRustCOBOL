[package]
name        = "cobolt-runtime"
description = "Cobolt COBOL — tree-walking interpreter, value system, and EXEC RUST executor"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
# Everything the interpreter has always had. Nothing in this workspace turns it
# off — `rcrun`, the IDE and every test keep the full surface.
default = ["sql", "http", "maps", "kb", "smb", "pdf", "office", "aws", "images", "audio"]

# The SQL bridge: `COBOL-OPEN-DB` and its five companions, over SQLite,
# PostgreSQL and MySQL.
#
# It is separable because of what SQLite costs to build. `rusqlite` is pinned
# with `bundled`, which compiles the SQLite **C amalgamation** — so every
# application built by PowerRustCOBOL needed a working **C toolchain**
# (`link.exe` on Windows, `cc` elsewhere) on top of `rustc`, including console
# programs that never open a database. The compiler now turns this off for a
# program it can prove never reaches SQL, and those builds need Rust alone.
sql = ["dep:rusqlite", "dep:postgres", "dep:mysql", "dep:bytes"]

# The REST client: `COBOL-HTTP-GET` and its five companions, plus the
# OpenRouteService door (`TraceRoad`) that goes over the same agent.
#
# Separable for the same reason `sql` is, one platform down: TLS here is the
# operating system's stack through `native-tls`, and on **Linux** that is
# OpenSSL — so building needed `libssl-dev` and a C toolchain to compile
# `openssl-sys`. A program that never calls an HTTP verb should not need
# either, and with this off `openssl-sys` leaves the graph.
#
# ⚠️ A FORM application still links TLS regardless: `cobolt-forms`'s `render`
# feature fetches OSM basemap tiles with its own `ureq`. This trims console
# programs, not form ones.
http = ["dep:ureq", "dep:native-tls"]

# The Maps data verbs — Directions, Geocoding, Places, Distance Matrix — over
# the `google_maps` client.
#
# Not a C dependency: `google_maps` is `reqwest` + `tokio`, pure Rust. It is
# separable for size and build time, being the largest single dependency the
# runtime carries and one only a program with a Maps control ever touches.
maps = ["dep:google_maps", "dep:tokio"]

# The application Knowledge Base — the `KnowledgeBase` control (spec 068). Pure
# Rust: redb and the lexical and endpoint embedders.
kb = ["dep:cobolt-kb"]

# …plus the built-in semantic model inside the application. Opt-in per project
# (`[rag] embedder = "builtin"`): it links candle and tokenizers, and
# tokenizers' `onig` compiles C. `rcrun` always carries it, so Run Form behaves
# like the built application.
kb-semantic = ["kb", "cobolt-kb/semantic"]

# `smb://` addresses for files an AgentObject registers by path (spec 075 R9),
# read without mounting the share. Pure Rust: `smb2` builds its signing and
# encryption on RustCrypto, with no `ring`, no `-sys` crate and no C. Separable
# only so an application without an AgentObject does not carry tokio's
# networking; the compiler turns it on when a form has one.
smb = ["dep:smb2", "dep:tokio"]

# The Viewer's `SaveAsPdf` — a document or a conversation written out as a PDF,
# exactly as the Viewer paints it (`cobolt-forms`' painter + `pdf_paint`).
# Pure Rust. Separable because it links the painter, which a Viewer-free
# program can do without; the compiler turns it on when a form has a Viewer.
pdf = ["cobolt-forms/pdf"]

# The Viewer opening Word, PowerPoint, Excel and OpenDocument files as their
# text. Pure Rust; on when a form has a Viewer, like `pdf`.
office = ["cobolt-forms/office"]

# The AWS controls (spec 078, amended by spec 103): an MCP client of AWS's own
# MCP servers. The five AWS Labs servers are child processes spoken to over
# stdio; the hosted AWS MCP Server is reached by this crate itself, over HTTPS
# signed with SigV4 (spec 103), so no `uvx` is needed for it. Therefore the
# feature depends on `http` (ureq + the operating system's TLS — never rustls,
# aws-lc-rs or ring) and on the official AWS crates below, which are built
# WITHOUT their own HTTPS client (`default-features = false`): this product
# supplies one over `ureq`. They are the 1.8.x line on purpose — every later
# release declares rust-version 1.94.1 and this workspace is 1.92 — and the
# lock is made with CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback.
# It gates code and crates, so an application without an AWS control carries
# none of them. The compiler turns it on when a form has one.
# `toml` reads the route table; every form application already links it
# through `cobolt-forms`, so it adds no crate to a build.
aws = [
    "dep:toml", "http", "dep:tokio",
    "dep:aws-config", "dep:aws-sigv4", "dep:aws-credential-types",
    "dep:aws-smithy-runtime-api", "dep:aws-smithy-types",
]

# `COBOL-IMAGE-FIT` and `COBOL-IMAGE-INFO` (spec 092 R10/R11): decode a
# picture, turn it upright, crop it to fill and write it at an exact size; or
# read its size from the header alone. Pure Rust — `image` with only the six
# codecs the built-ins promise (`default-features = false`: no `rayon`, none of
# its other default codecs). Separable because a console program that never fits a
# picture should not carry six decoders; the compiler turns it on when a program
# calls either built-in. A FORM application links `image` regardless, through
# `cobolt-forms`' `render` feature, with these same codecs.
images = ["dep:image"]

# Sound (spec 092 R15–R18): `COBOL-AUDIO-PLAY` and its four companions play an
# MP3, OGG Vorbis, WAV or FLAC file on the default output device.
#
# `rodio` owns the device through `cpal` and decodes through `symphonia` — pure
# Rust on every platform, but on **Linux** `cpal` reaches the sound card through
# ALSA, so building needs the ALSA development package (`libasound2-dev`,
# `alsa-lib-devel`) and running needs `libasound2`. macOS (CoreAudio) and
# Windows (WASAPI) need nothing. Separable for exactly that reason, like `http`:
# the compiler turns it on only for a program that calls one of the verbs.
audio = ["dep:rodio"]

[dependencies]
# Free memory, for the fit test of a registered file (spec 075 R18); the
# host name, for the key store's cipher key (spec 076 R10).
sysinfo = { workspace = true }
# The key store's file (spec 076 R10): AES-256-GCM over a SHA-256-derived key,
# a random nonce. All RustCrypto, pure Rust — the versions smb2 already uses.
aes-gcm   = "0.11"
sha2      = "0.11"
getrandom = "0.4"
# Spec 062 — the unique half of a printed report's filename. Already in the
# lock as a transitive dependency, so naming it here resolves nothing new.
uuid            = { version = "1", features = ["v4"] }
cobolt-lexer    = { path = "../cobolt-lexer" }
cobolt-ast      = { path = "../cobolt-ast" }
# The exact decimal kernel (`CobolNumeric`), shared with the WebAssembly
# support routines (spec WASM-010 R6): `value.rs` re-exports it.
cobolt-decimal  = { path = "../cobolt-decimal" }
cobolt-format   = { path = "../cobolt-format" }
# WASM-005 — the group <-> JSON mapping and the seam a remote call crosses.
cobolt-wire     = { path = "../cobolt-wire" }
# The debugger's expression evaluator parses what the developer types in a watch
# or at the console prompt. It reuses the REAL parser rather than carrying a
# second, smaller COBOL grammar that would drift from it. No cycle: the parser
# depends only on the lexer and the AST.
cobolt-parser   = { path = "../cobolt-parser" }
cobolt-semantic = { path = "../cobolt-semantic" }
cobolt-indexed  = { path = "../cobolt-indexed" }
# The form model, WITHOUT its `render` feature — no egui reaches the
# interpreter. `FDZ::CommitFiles()` copies a staged drop into its destination,
# and the rules for that (what lands where, never overwriting, how a row reads)
# are `cobolt_forms::dropzone`'s. Depending on them beats keeping a second copy
# here: two tables of the same rule is how the IntelliSense/knowledge-base
# drift got in, and a drop zone's rules are worth less to duplicate still.
cobolt-forms    = { path = "../cobolt-forms" }
# spec 065 — the MCP protocol. serde-only and transport-free, so linking it
# adds no network stack to an application that serves a tool.
cobolt-mcp      = { path = "../cobolt-mcp" }
toml            = { workspace = true, optional = true }
# spec 068 — the application Knowledge Base engine (feature `kb`).
cobolt-kb       = { path = "../cobolt-kb", optional = true }
thiserror       = { workspace = true }
indexmap        = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
serde_json      = { workspace = true }
tracing         = { workspace = true }
# Phase 8 — database runtime.
# SQLite is bundled (no system library required). PostgreSQL and MySQL use the
# pure-Rust synchronous drivers; MySQL is pinned to its rustls feature set so no
# OpenSSL / system library is needed to build.
rusqlite        = { workspace = true, optional = true, features = ["column_decltype"] }  # spec 087: declared column types for typed values
postgres        = { version = "0.19", optional = true }
# spec 087: the buffer type PostgreSQL parameters are written into (already
# in the graph through `postgres`).
bytes           = { version = "1", optional = true }
mysql           = { version = "28", default-features = false, features = ["minimal-rust"], optional = true }
# Phase 12 — crash-safe INDEXED engine substrate (pure-Rust ACID, no system lib).
#
# `experimental-api-5` is asked for HERE, not only by `cobolt-kb`. The
# Knowledge Base needs redb's multi-process mode, which requires that API, and
# cargo unions features — so whenever `kb` is in a build this crate is compiled
# against the api-5 signatures. Asking for it always keeps ONE redb API in this
# crate, with or without `kb` (spec 068). It changes signatures only: the file
# format and the default whole-file lock are unchanged. Pinned exactly, since an
# experimental API may move between releases.
redb            = { version = "=4.3.0", features = ["experimental-api-5"] }
# The v2→v3 upgrade shim, and nothing else. redb 3 REMOVED the v2 file format
# and the only `Database::upgrade()` that reads v2 lives in redb 2.6 — so a
# container written by an earlier PowerRustCOBOL can be migrated by exactly one
# call into this older copy, and is then opened by the current one. Two majors
# of redb in the graph is the price of not orphaning existing data files.
redb2           = { package = "redb", version = "2.6" }
# Phase 10 — REST client runtime (blocking HTTP, no async required)
ureq            = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"], optional = true }  # native-tls, not rustls (ring compiles C)
native-tls      = { version = "0.2", optional = true }   # the connector ureq needs handed to it; see http_runtime::tls_connector
# Spec 092 — the picture built-ins (feature `images`). The version and the codec
# list are `cobolt-forms`' own, so a form application resolves ONE `image`.
image           = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"], optional = true }
# Maps control (spec 039 T11): Directions/Geocoding/Places/Distance-Matrix
# only — never the OSM basemap tiles (cobolt-forms fetches those directly).
# This crate is `reqwest`+async, unlike the rest of this crate's blocking
# `ureq`-based I/O; its calls run on a background worker thread that
# privately owns a small `tokio::Runtime` (plan.md §4 Decision 5) so the
# interpreter's own event loop never becomes async.
google_maps = { version = "3.10.0", default-features = false, features = [
  "reqwest",
  "geocoding",
  "directions",
  "places",
  "distance_matrix",
], optional = true }
tokio       = { workspace = true, optional = true }
# Spec 103 — the hosted AWS MCP Server, signed natively (feature `aws`). Pinned to
# the minor series whose rust-version is <= 1.92 (see the `aws` feature above).
# `aws-config` supplies the credential providers (environment, shared files,
# `credential_process`, SSO, `aws login`, role assumption); with its defaults off it
# has no HTTP client, which `aws::https` provides over `ureq`.
aws-config               = { version = "~1.8", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "credentials-login", "behavior-version-latest"], optional = true }
aws-sigv4                = { version = "~1.4", default-features = false, features = ["sign-http"], optional = true }
aws-credential-types     = { version = "~1.2", optional = true }
aws-smithy-runtime-api   = { version = "~1.12", features = ["client", "http-1x"], optional = true }
aws-smithy-types         = { version = "~1.5", optional = true }
# Pinned exactly: 0.26.0 is young and moves fast (spec 075 plan, Risks).
smb2        = { version = "=0.26.0", default-features = false, features = ["tokio"], optional = true }
# COBOL-85 `ACCEPT … FROM DATE/TIME/DAY/DAY-OF-WEEK` and `FUNCTION CURRENT-DATE`
# are defined on the **local** clock, and CURRENT-DATE reports the real offset
# from GMT in its last five characters. Deriving them from UNIX_EPOCH gives UTC,
# which is simply a different time of day for most of the world.
#
# This adds nothing to the build: `chrono` is already compiled into this crate
# through `google_maps` → `chrono-tz`. `clock` is the feature that reads the
# machine's zone; no C toolchain and no system library come with it.
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sound (feature `audio`). Defaults off: they would add recording, MP4/AAC and
# dithering, none of which the verbs use. `playback` is the output device
# (`cpal`); `tracing` sends rodio's own device messages to the log instead of
# stderr (the crate is already ours); the four format features are symphonia's
# pure-Rust decoders — `mp3`, `vorbis` (with its OGG container), `flac`, `wav`
# (with PCM).
rodio       = { version = "0.22", default-features = false, features = ["playback", "tracing", "mp3", "vorbis", "flac", "wav"], optional = true }

[dev-dependencies]
cobolt-codegen    = { path = "../cobolt-codegen" }
cobolt-forms      = { path = "../cobolt-forms" }
cobolt-lexer      = { path = "../cobolt-lexer" }
cobolt-parser     = { path = "../cobolt-parser" }
cobolt-semantic   = { path = "../cobolt-semantic" }
pretty_assertions = { workspace = true }
# Archive fixtures for the KnowledgeBase document-import test (spec 074).
zip               = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
tempfile          = "3"
# Spec 103: the tests verify every signed request with their OWN SigV4 code (not the
# crate that signed it). The workspace's hmac 0.12 pairs with sha2 0.10, not with the
# 0.11 this crate uses for itself, so the 0.10 line is named here for the tests only.
hmac              = { workspace = true }
sha2_010          = { package = "sha2", version = "0.10" }
# test_accept_from_mnemonic.rs redirects the test binary's real stdin to
# /dev/null so a Format 1 ACCEPT cannot block the suite forever — already in
# the lockfile transitively, so this adds no new code to the build.
libc              = "0.2"

# A scriptable MCP server for the AWS tests (spec 078 T-A4): it speaks the
# protocol over stdio and records every request, so no test needs an AWS
# account. Test infrastructure only — never shipped in an application.
[[bin]]
name              = "fake_mcp"
path              = "src/bin/fake_mcp.rs"
required-features = ["aws"]

# A stand-in application for the no-orphans test (spec 078 T-A7): starts the
# fake through the pool, then exits normally, exits abruptly, or waits to be
# killed. Test infrastructure only.
[[bin]]
name              = "aws_host_probe"
path              = "src/bin/aws_host_probe.rs"
required-features = ["aws"]
