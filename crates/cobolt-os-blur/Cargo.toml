[package]
name         = "cobolt-os-blur"
description  = "Native window calls for PowerRustCOBOL windows: the desktop blur behind them (macOS window server, Windows DWM) and window groups that move as one (macOS), shared by the IDE and the form host"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# No dependencies on purpose: the platform calls are declared here, so the
# crate type-checks for every target from any machine (spec 083 AC3).
[dependencies]
