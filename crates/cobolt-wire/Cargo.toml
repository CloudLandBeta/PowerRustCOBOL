[package]
name        = "cobolt-wire"
description = "Cobolt COBOL — the frontend-backend contract: group layouts, the COBOL group <-> JSON mapping, the wire protocol, errors and the interface description (WASM-005, WASM-014)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# Deliberately small: this crate is linked by the interpreter, the semantic
# analyser, the compiler and the backend server, and it is the reference the
# browser module's generator is held to. It knows nothing of egui, sockets,
# files or the runtime.
[dependencies]
cobolt-ast = { path = "../cobolt-ast" }
serde      = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }

# The sealed channel (WASM-003 T15b). Off by default: the interpreter, the analyser and the compiler never link it.
sha2             = { workspace = true, optional = true }
hkdf             = { workspace = true, optional = true }
x25519-dalek     = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
zeroize          = { workspace = true, optional = true }
base64           = { version = "0.22", optional = true }

[features]
channel = ["dep:base64", "dep:sha2", "dep:hkdf", "dep:x25519-dalek", "dep:chacha20poly1305", "dep:zeroize"]

[dev-dependencies]
cobolt-lexer  = { path = "../cobolt-lexer" }
cobolt-parser = { path = "../cobolt-parser" }
