[package]
name = "cobolt-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rig-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tantivy = "0.22.1"
rig-sqlite = "0.40.0"
tokenizers = "0.23.1"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", optional = true, features = ["http", "http-proto", "internal-logs", "logs", "metrics", "opentelemetry-http", "prost", "reqwest-blocking-client", "trace"] }
ndarray = "0.15"
num_cpus = "1.16"
ort = "2.0.0-rc.12"
sqlite-vec = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"
cobolt-forms = { path = "../cobolt-forms" }
tempfile = "3.10"

[features]
default = []
otel = [] # Optional OpenTelemetry export support
