[package]
name         = "cobolt-web-tests"
description  = "The web test crate (WASM-015 D4): shared helpers and fixtures for the browser, backend and module runners"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish = false

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
cobolt-project-tools = { path = "../cobolt-project-tools" }
cobolt-forms         = { path = "../cobolt-forms", features = ["render"] }
cobolt-wasm          = { path = "../cobolt-wasm", features = ["host"] }
cobolt-server        = { path = "../cobolt-server", features = ["testkit"] }
cobolt-web-bundle    = { path = "../cobolt-web-bundle" }
cobolt-codegen       = { path = "../cobolt-codegen" }
cobolt-mcp           = { path = "../cobolt-mcp" }
tokio                = { workspace = true }
# The headless-Chrome DevTools client the Chrome tests share (`cobolt-web-bundle/tests/support/cdp.rs`, reached by path):
# its dependencies, the same versions the project-tools tests use, all already in the lock file.
tempfile             = "3"
tungstenite          = { version = "0.28", default-features = false, features = ["handshake"] }
png                  = "0.17"
base64               = "0.22"
# DESKTOP-WASM-001 T1 (AC16): the Web module of PowerAnalyticsWeb is pinned by its sha256.
sha2                 = { workspace = true }
