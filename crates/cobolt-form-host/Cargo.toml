[package]
name         = "cobolt-form-host"
description  = "The one form host shared by `rcrun run-form` and compiled applications (spec 042)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
# Forwarded, not owned. Cargo unions features across a dependency graph, so a
# built form application that asks `cobolt-runtime` for no SQL would get it back
# the moment THIS crate asked for the default — and the SQLite C amalgamation
# with it. The generated manifest turns both off together.
default = ["sql", "http", "maps"]
sql = ["cobolt-runtime/sql"]
http = ["cobolt-runtime/http"]
maps = ["cobolt-runtime/maps"]

[dependencies]
cobolt-ast     = { path = "../cobolt-ast" }
cobolt-forms   = { path = "../cobolt-forms", features = ["render"] }
cobolt-runtime = { path = "../cobolt-runtime", default-features = false }
cobolt-media   = { path = "../cobolt-media" }

egui        = "0.36"
eframe      = { version = "0.36", features = ["default_fonts"] }
egui_extras = { version = "0.36", features = ["image"] }
image       = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }

# Native file dialogs (FileDropZone click-to-browse) — opened asynchronously:
# a synchronous dialog nests the OS event loop, which aborts winit 0.30 with
# "tried to handle event while another event is currently being handled".
rfd      = "0.14"
pollster = "0.3"

[dev-dependencies]
pretty_assertions = { workspace = true }
cobolt-lexer  = { path = "../cobolt-lexer" }
cobolt-parser = { path = "../cobolt-parser" }
