<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600">
  <!-- PowerChat's welcome robot: a friendly chibi in white, grey, blue and
       black, the PowerRustCOBOL emblem on its chest. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E6E9EE"/>
      <stop offset="1" stop-color="#B9C0CA"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA3AF"/>
      <stop offset="1" stop-color="#5E6773"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F26"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FE3FF"/>
      <stop offset="0.6" stop-color="#2FA8F5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB3FF"/>
      <stop offset="1" stop-color="#1E5FB4"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E35"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="250" cy="572" rx="150" ry="18" fill="#000000" opacity="0.28"/>

  <!-- legs and feet -->
  <rect x="178" y="470" width="50" height="70" rx="20" fill="url(#metal)" stroke="#2B3038" stroke-width="5"/>
  <rect x="272" y="470" width="50" height="70" rx="20" fill="url(#metal)" stroke="#2B3038" stroke-width="5"/>
  <path d="M150 548 q0 -30 30 -30 h52 q22 0 22 22 v8 q0 10 -10 10 h-84 q-10 0 -10 -10z" fill="url(#blue)" stroke="#15181D" stroke-width="5"/>
  <path d="M246 548 q0 -22 22 -22 h52 q30 0 30 30 v0 q0 10 -10 10 h-84 q-10 0 -10 -10z" fill="url(#blue)" stroke="#15181D" stroke-width="5" transform="translate(4 -8)"/>
  <rect x="152" y="552" width="100" height="10" rx="5" fill="#15181D"/>
  <rect x="252" y="552" width="100" height="10" rx="5" fill="#15181D"/>

  <!-- left arm, resting -->
  <path d="M142 350 q-44 30 -40 92" fill="none" stroke="#2B3038" stroke-width="34" stroke-linecap="round"/>
  <path d="M142 350 q-44 30 -40 92" fill="none" stroke="url(#metal)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="102" cy="452" r="26" fill="url(#shell)" stroke="#2B3038" stroke-width="5"/>
  <rect x="88" y="446" width="28" height="7" rx="3.5" fill="#1E5FB4"/>

  <!-- right arm, waving -->
  <path d="M358 346 q52 -30 58 -104" fill="none" stroke="#2B3038" stroke-width="34" stroke-linecap="round"/>
  <path d="M358 346 q52 -30 58 -104" fill="none" stroke="url(#metal)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="418" cy="226" r="28" fill="url(#shell)" stroke="#2B3038" stroke-width="5"/>
  <path d="M404 206 v-16 M418 202 v-20 M432 206 v-16" stroke="#2B3038" stroke-width="8" stroke-linecap="round"/>
  <path d="M446 196 q14 10 12 28 M458 186 q20 16 16 42" fill="none" stroke="#4FB3FF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- body -->
  <path d="M150 326 q0 -28 28 -28 h144 q28 0 28 28 v118 q0 40 -40 40 h-120 q-40 0 -40 -40z" fill="url(#shell)" stroke="#2B3038" stroke-width="6"/>
  <path d="M168 452 q82 26 164 0" fill="none" stroke="#9AA3AF" stroke-width="5" stroke-linecap="round"/>
  <!-- chest plate with the PowerRustCOBOL emblem -->
  <path d="M250 330 l52 30 v60 l-52 30 l-52 -30 v-60z" fill="url(#badge)" stroke="#F07A1A" stroke-width="7" stroke-linejoin="round"/>
  <path d="M232 368 l-14 22 l14 22" fill="none" stroke="#F07A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M268 368 l14 22 l-14 22" fill="none" stroke="#F07A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="244" y="370" width="12" height="12" rx="3" fill="#F07A1A"/>
  <rect x="244" y="398" width="12" height="12" rx="3" fill="#F07A1A"/>
  <!-- blue status lights on the belly -->
  <circle cx="206" cy="440" r="6" fill="url(#glow)"/>
  <circle cx="294" cy="440" r="6" fill="url(#glow)"/>

  <!-- neck -->
  <rect x="222" y="280" width="56" height="26" rx="10" fill="url(#metal)" stroke="#2B3038" stroke-width="5"/>

  <!-- antenna -->
  <path d="M250 62 v-26" stroke="#2B3038" stroke-width="8" stroke-linecap="round"/>
  <circle cx="250" cy="30" r="17" fill="url(#glow)" stroke="#15181D" stroke-width="5"/>
  <circle cx="244" cy="24" r="5" fill="#FFFFFF" opacity="0.85"/>

  <!-- ears -->
  <rect x="66" y="150" width="42" height="92" rx="18" fill="url(#blue)" stroke="#15181D" stroke-width="6"/>
  <rect x="392" y="150" width="42" height="92" rx="18" fill="url(#blue)" stroke="#15181D" stroke-width="6"/>
  <rect x="80" y="170" width="14" height="52" rx="7" fill="#9FE3FF" opacity="0.55"/>
  <rect x="406" y="170" width="14" height="52" rx="7" fill="#9FE3FF" opacity="0.55"/>

  <!-- head: big, round, chibi -->
  <rect x="90" y="58" width="320" height="236" rx="100" fill="url(#shell)" stroke="#2B3038" stroke-width="7"/>
  <path d="M130 92 q60 -30 120 -30" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <!-- face screen -->
  <rect x="130" y="110" width="240" height="150" rx="62" fill="url(#screen)" stroke="#5E6773" stroke-width="6"/>
  <!-- happy eyes -->
  <path d="M176 186 q24 -34 48 0" fill="none" stroke="#4FB3FF" stroke-width="13" stroke-linecap="round"/>
  <path d="M276 186 q24 -34 48 0" fill="none" stroke="#4FB3FF" stroke-width="13" stroke-linecap="round"/>
  <path d="M176 186 q24 -34 48 0" fill="none" stroke="#BFEAFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M276 186 q24 -34 48 0" fill="none" stroke="#BFEAFF" stroke-width="4" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M226 218 q24 20 48 0" fill="none" stroke="#4FB3FF" stroke-width="8" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="164" cy="222" rx="14" ry="7" fill="#4FB3FF" opacity="0.35"/>
  <ellipse cx="336" cy="222" rx="14" ry="7" fill="#4FB3FF" opacity="0.35"/>
  <!-- screen shine -->
  <path d="M152 138 q16 -18 44 -20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
</svg>
