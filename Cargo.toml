[workspace]
members = [
    "crates/cobolt-lexer",
    "crates/cobolt-ast",
    "crates/cobolt-parser",
    "crates/cobolt-semantic",
    "crates/cobolt-decimal",   # WASM-010 — the exact decimal kernel (no_std), shared by the interpreter and the WebAssembly routines
    "crates/cobolt-format",     # spec 109 — locale-aware number formatting (no_std), shared by the interpreter and the WebAssembly routines
    "crates/cobolt-numedit",   # WASM-010 — the numeric-edited PICTURE engine (no_std), shared by the form painter, the interpreter and the WebAssembly routines
    "crates/cobolt-wasm",      # WASM-010 — the generator: COBOL AST to one self-contained WebAssembly module
    "crates/cobolt-wasm-rt",   # WASM-010 — the support routines linked into every generated module (compiled to wasm32)
    "crates/cobolt-runtime",
    "crates/cobolt-stdlib",
    "crates/cobolt-cli",
    "crates/cobolt-forms",
    "crates/cobolt-indexed",
    "crates/cobolt-media",      # Animator widget — animated-image decode + playback
    "crates/cobolt-codegen",
    "crates/cobolt-compiler",   # Phase 11 — embed+bundle binary compiler
    "crates/cobolt-form-host",  # spec 042 — the ONE form host (run-form + built apps)
    "crates/cobolt-os-blur",    # spec 083 — desktop blur behind see-through windows (macOS, Windows)
    # "crates/cobolt-plugin-api",
    # "crates/cobolt-plugin-loader",
    "crates/cobolt-dap",       # wire-compatible Debug Adapter Protocol (client + adapter)
    "crates/cobolt-mcp",       # spec 065 — wire-compatible Model Context Protocol (framing + server)
    "crates/cobolt-project-tools", # spec 080 — the coding-agent tools (rcrun mcp + the IDE's MCP endpoint)
    "crates/cobolt-docs",      # spec 074 — document import (Office, PDF, HTML, archives → Markdown)
    "crates/cobolt-kb",        # spec 068 — the application Knowledge Base (collections, index, search)
    "crates/cobolt-graphics",  # WASM-018 — Canvas 2D/3D + ImageBuffer, Plot, Scene3D, Physics2D/3D (pure Rust, native + wasm32)
    "crates/cobolt-wire",      # WASM-005/014 — the frontend-backend contract: layouts, group <-> JSON, protocol
    "crates/cobolt-server",    # WASM-003/014/009 — the headless backend server and the client that calls it
    "crates/cobolt-ide", "crates/cobolt-agents",
    "crates/cobolt-web-preview", # WASM-008 — the helper process holding the system web view of the web Preview
    "crates/cobolt-bench",   # performance + allocation baseline harness
    "crates/cobolt-wasm-abi",  # WASM-ABI-v1 — the contract between the program module, the player and the host page (2.x.x)
    "crates/cobolt-web-bundle", # the Web bundle assembler: host page, loader, headers, CSP, SRI, dev server (2.x.x)
]
# The prebuilt browser player is its own Cargo workspace (wasm-bindgen pinned to the installed CLI,
# a nightly confined to its build, its own lock file): see crates/cobolt-web-player/Cargo.toml.
exclude = ["crates/cobolt-web-player"]
resolver = "2"

# ── Shared package metadata ────────────────────────────────────────────────────
[workspace.package]
version      = "0.2.0"
edition      = "2021"
rust-version = "1.92"
license      = "Apache-2.0"
repository   = "https://github.com/yourusername/cobolt"
homepage     = "https://github.com/yourusername/cobolt"
keywords     = ["cobol", "ide", "interpreter", "powercobol"]
categories   = ["development-tools", "compilers"]

# ── Shared dependencies (version pinned once here) ────────────────────────────
[workspace.dependencies]
# Lexer
logos       = "0.14"

# Error handling
thiserror   = "2"

# Serialization (used by forms / project config)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
quick-xml   = { version = "0.36", features = ["serialize"] }
toml        = "0.8"

# YAML + integrity (menu control persistence)
serde_yaml  = "0.9"
hmac        = "0.12"
sha2        = "0.10"

# Data structures
indexmap    = { version = "2", features = ["serde"] }

# Logging
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }

# Phase 11 — binary compiler (AST serialization + compression)
bincode = "1"
flate2  = "1"

# Run Form inspector — cross-platform process/system metrics (CPU%, RSS, children)
sysinfo = "0.31"

# WASM-003 R2 — the backend's HTTP front is built on Leptos's server integration.
# Server side only (`ssr`): no client crate, no hydration. `leptos_axum` keeps its
# defaults: they are its tokio executor and server-function service (`server_fn/axum`),
# which the front runs on (WASM-003 T10a).
# Guarded by crates/cobolt-server/tests/dependency_guards.rs (no ring/aws-lc/rustls/openssl).
leptos        = { version = "0.8", default-features = false, features = ["ssr"] }
leptos_axum   = { version = "0.8" }
leptos_router = { version = "0.8", default-features = false, features = ["ssr"] }
axum        = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper       = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util  = { version = "0.1", default-features = false, features = ["tokio", "service"] }

# Dev / test utilities
pretty_assertions = "1"

# Mesh architecture dependencies
rig-core = { version = "0.40.0", default-features = false, features = ["reqwest", "derive", "native-tls"] }  # native-tls, not rustls: keeps aws-lc-rs/ring (C) out
tokio    = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
