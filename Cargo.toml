[workspace]
members = [
    "crates/cobolt-lexer",
    "crates/cobolt-ast",
    "crates/cobolt-parser",
    "crates/cobolt-semantic",
    "crates/cobolt-runtime",
    "crates/cobolt-stdlib",
    "crates/cobolt-cli",
    "crates/cobolt-forms",
    "crates/cobolt-indexed",
    "crates/cobolt-media",      # Animator widget — animated-image decode + playback
    "crates/cobolt-codegen",
    "crates/cobolt-compiler",   # Phase 11 — embed+bundle binary compiler
    # "crates/cobolt-plugin-api",
    # "crates/cobolt-plugin-loader",
    "crates/cobolt-ide", "crates/cobolt-agents",
]
resolver = "2"

# ── Shared package metadata ────────────────────────────────────────────────────
[workspace.package]
version      = "0.2.0"
edition      = "2021"
rust-version = "1.92"
license      = "Apache-2.0"
repository   = "https://github.com/yourusername/cobolt"
homepage     = "https://github.com/yourusername/cobolt"
keywords     = ["cobol", "ide", "interpreter", "powercobol"]
categories   = ["development-tools", "compilers"]

# ── Shared dependencies (version pinned once here) ────────────────────────────
[workspace.dependencies]
# Lexer
logos       = "0.14"

# Error handling
thiserror   = "2"

# Serialization (used by forms / project config)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
quick-xml   = { version = "0.36", features = ["serialize"] }
toml        = "0.8"

# YAML + integrity (menu control persistence)
serde_yaml  = "0.9"
hmac        = "0.12"
sha2        = "0.10"

# Data structures
indexmap    = { version = "2", features = ["serde"] }

# Logging
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }

# Phase 11 — binary compiler (AST serialization + compression)
bincode = "1"
flate2  = "1"

# Run Form inspector — cross-platform process/system metrics (CPU%, RSS, children)
sysinfo = "0.31"

# Dev / test utilities
pretty_assertions = "1"

# Mesh architecture dependencies
rig-core = "0.40.0"
tokio    = { version = "1", features = ["full"] }
