# Manual, on-demand build of PowerRustCOBOL (the IDE) and rcrun (the CLI
# runtime) for every supported desktop platform.
#   Actions -> "Build PowerRustCOBOL (all platforms)" -> Run workflow
#
# Tick "Publish the packages as a GitHub Release" to put the downloads on the
# releases page, where anyone can fetch them without a GitHub account. Leave it
# clear for a build you only want to inspect.
#
# NINE downloads. Every platform gets an archive and at least one installer,
# all of them carrying the same application:
#
#   an ARCHIVE   self-contained — unpack it anywhere and run it, with nothing to
#                install first, including where the user cannot install
#                software. Every platform has one; on a Linux that is neither
#                Debian- nor RPM-based it is the only download.
#   an INSTALLER .msi on Windows, .dmg on macOS, .deb and .rpm on Linux — the
#                two halves of the Linux desktop world, which between them cover
#                Debian/Ubuntu/Mint and Fedora/RHEL/openSUSE. Built FROM the
#                staged archive, never from a fresh file list, so the two can
#                never disagree about what ships. What it adds is the install:
#                a Start Menu / Applications entry, a desktop launcher, rcrun on
#                PATH, and a supported way to remove it again.
#
# No AppImage. It would need appimagetool fetched as an opaque binary at build
# time, and the tarball already gives every other distro download-and-run; the
# only thing an AppImage would add over it is the menu entry the .deb and .rpm
# already provide where they apply. Worth revisiting only if someone asks.
#
# NEITHER IS SIGNED. SmartScreen and Gatekeeper key off a paid certificate
# (Authenticode; Apple Developer ID), so an .msi earns exactly the same first-run
# warning a .zip does — an installer is not inherently more trusted. Notarising
# the .dmg would run here happily (`xcrun notarytool submit`), but it needs that
# certificate in the repository secrets first.
#
#   Windows   the Visual C++ runtime DLLs travel with the executables
#             (.cargo/config.toml links the dynamic CRT deliberately, so those
#             DLLs are the one prerequisite a clean Windows 10 lacks). The UCRT
#             is part of Windows 10 and later, so it is not shipped.
#   macOS     a real PowerRustCOBOL.app bundle, ad-hoc signed, with the icon
#             and the assets tree inside it. Only system frameworks are linked.
#   Linux     OpenSSL is linked statically, so no libssl.so.3 has to be present
#             or match. What is left is glibc plus the graphics stack, which
#             must come from the host: OpenGL, X11 and Wayland are the driver's
#             own libraries and bundling them would break the machine's GPU.
#
# A note on Linux: the desktop shell is not a build target. One x86_64 Linux
# binary serves GNOME, KDE, Xfce and the rest — they differ in the window
# manager, not the ABI. What does matter is the glibc the binary links against,
# so Linux is built on Ubuntu 22.04 (glibc 2.35): the result runs on Ubuntu
# 22.04 and everything newer, plus Debian 12+ and Fedora 36+. Building on
# ubuntu-latest (24.04, glibc 2.39) would silently drop every older distro.

name: Build PowerRustCOBOL (all platforms)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages as a GitHub Release
        type: boolean
        default: false
      tag:
        description: "Release tag. Default: v + the version in version.rs. An existing tag has its release updated in place."
        type: string
        default: ""
      title:
        description: "Release title. Default: PowerRustCOBOL + the version."
        type: string
        default: ""

concurrency:
  group: build-all-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Deliberately no RUSTFLAGS here: a RUSTFLAGS environment variable REPLACES
  # the per-target rustflags in .cargo/config.toml, which is where the MSVC
  # dynamic-CRT link arguments live. Setting it would break the Windows link.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          # MSVC targets Windows 10 (1607) and later, which covers Windows 10.x
          # and 11.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          # Intel macOS. The old macos-13 image was retired in December 2025;
          # macos-15-intel is its replacement (macos-26-intel is the newer one).
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v7

      # openssl-sys links the system OpenSSL (native-tls), and eframe needs the
      # xcb/xkbcommon headers. Everything else the tree touches — winit's X11
      # and Wayland bindings, the file dialog's XDG portal client — is loaded at
      # runtime, so no GTK development package is required.
      #
      # OPENSSL_STATIC makes openssl-sys link libssl.a/libcrypto.a from
      # libssl-dev instead of the shared objects, which is what frees the
      # package from the host's OpenSSL version. The CA bundle is still found at
      # runtime: native-tls asks openssl-probe for the host's certificate store,
      # so HTTPS keeps working on distros that place it elsewhere.
      #
      # The two directories are not optional. On its own OPENSSL_STATIC is
      # ignored, because openssl-sys resolves OpenSSL through pkg-config and
      # pkg-config emits dynamic link flags; naming both directories sends it
      # down the path where the static request is honoured.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build PowerRustCOBOL and rcrun
        run: >
          cargo build --release --locked
          --target ${{ matrix.target }}
          -p cobolt-ide -p cobolt-cli

      - name: Name the package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";/\1/p' crates/cobolt-ide/src/version.rs)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG=PowerRustCOBOL-${version}-${{ matrix.name }}" >> "$GITHUB_ENV"

      # Linux and Windows: one flat directory. The IDE spawns `rcrun` from its
      # own directory (Run Form) and reads `assets/` from beside its executable
      # — theme packs, the welcome backgrounds, the licence texts, and the
      # screenshots and animations the documentation viewer draws inline — so
      # the binaries and the assets tree have to travel together. Shipping a
      # subset is what left an installed IDE with no themes and no background:
      # anything the binary opens at RUN time has to be in the package, and only
      # what it embeds at COMPILE time (the docs, the knowledge store, the icons
      # and every agent prompt) may be left behind.
      #
      # `assets/knowledge` is exactly that case and is deleted again after the
      # copy: the 8.5 MB chunked store is `include_bytes!`d into the IDE binary
      # (`grace_host.rs`, PREBUILT_CHUNKED_KB) and installed from there to
      # `~/PowerRustCOBOL/data/` on first run. Nothing in the workspace opens it
      # from beside the executable, so every archive was carrying 8.5 MB it
      # never read (operator, 2026-09-09). Copy-then-delete rather than an
      # exclusion so the rule stays one obvious line: everything ships, minus
      # what is already inside the binary.
      #
      # `examples/` travels for the same reason: `example_project_manifest`
      # looks for `examples/PowerDemo3/PowerDemo3.project.toml` beside the
      # executable, so without it Help -> Examples is greyed out in every
      # release install. It is staged with `git archive` rather than `cp -R`
      # because the working tree also holds that project's build output —
      # `target/`, `bin/`, generated data — which is ~280 MB of nothing a user
      # needs.
      - name: Stage the package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/$PKG"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/cobolt-ide${{ matrix.ext }}" "$out/PowerRustCOBOL${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/rcrun${{ matrix.ext }}" "$out/rcrun${{ matrix.ext }}"
          cp -R assets "$out/assets"
          rm -rf "$out/assets/knowledge"
          git archive HEAD examples | tar -x -C "$out"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$out/"

      # Build is a real `cargo build` against the platform's own crates, so an
      # IDE shipped on its own can never build anything — and a project holding
      # one `EXEC RUST` block anywhere cannot even be RUN, because every launch
      # in such a project takes the build path. `examples/PowerDemo3` is one of
      # those, which is how this was found: the flagship demo would not start
      # from a release install on any platform.
      #
      # `stage_sdk` writes the tree `resolve_workspace_root` already looks for
      # — <install>/sdk/Cargo.toml + <install>/sdk/crates — so nothing has to
      # be configured on the user's machine.
      - name: Stage the platform SDK
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --locked --target ${{ matrix.target }} \
            -p cobolt-compiler --example stage_sdk -- "dist/$PKG/sdk"
          test -f "dist/$PKG/sdk/Cargo.toml"
          test -d "dist/$PKG/sdk/crates/cobolt-ast"

      # The Visual C++ runtime, deployed app-local (the form Microsoft supports
      # for applications that ship their own copy). Without these a clean
      # Windows 10 refuses to start the executables.
      - name: Bundle the Visual C++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          crt=$(ls -d "/c/Program Files/Microsoft Visual Studio/"*/*"/VC/Redist/MSVC/"*"/x64/Microsoft.VC"*".CRT" | tail -1)
          test -d "$crt"
          cp "$crt"/*.dll "dist/$PKG/"
          test -f "dist/$PKG/vcruntime140.dll"
          test -f "dist/$PKG/msvcp140.dll"

      # macOS: a real application bundle. `rcrun` lives beside the main
      # executable because that is where the IDE looks for it, and the theme
      # packs sit in Resources with a symlink from MacOS/, which satisfies the
      # exe-relative lookup without putting data files in MacOS/.
      - name: Stage the application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out="dist/$PKG"
          app="$out/PowerRustCOBOL.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/cobolt-ide" "$app/Contents/MacOS/PowerRustCOBOL"
          cp "target/${{ matrix.target }}/release/rcrun" "$app/Contents/MacOS/rcrun"
          cp -R assets "$app/Contents/Resources/assets"
          # Already inside the binary — see the Linux/Windows staging step.
          rm -rf "$app/Contents/Resources/assets/knowledge"
          ln -s "../Resources/assets" "$app/Contents/MacOS/assets"
          git archive HEAD examples | tar -x -C "$app/Contents/Resources"
          ln -s "../Resources/examples" "$app/Contents/MacOS/examples"
          ln -s "PowerRustCOBOL.app/Contents/MacOS/rcrun" "$out/rcrun"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$out/"

          iconset=$(mktemp -d)/PowerRustCOBOL.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/images/powerrustcobol-icon.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" assets/images/powerrustcobol-icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/PowerRustCOBOL.icns"

          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Save" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string PowerRustCOBOL" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string PowerRustCOBOL" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.cloudlandbeta.powerrustcobol" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string PowerRustCOBOL" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string PowerRustCOBOL" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 11.0" "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$plist"

          # The platform SDK, inside Resources where the search already looks.
          # It has to be staged BEFORE the signature: adding a file to a signed
          # bundle breaks the seal, and `codesign --verify --strict` below is
          # what would catch it.
          cargo run --release --locked --target ${{ matrix.target }} \
            -p cobolt-compiler --example stage_sdk -- "$app/Contents/Resources/sdk"
          test -f "$app/Contents/Resources/sdk/Cargo.toml"
          test -d "$app/Contents/Resources/sdk/crates/cobolt-ast"

          # Ad-hoc signature. Apple Silicon refuses to run an unsigned binary,
          # and assembling the bundle invalidates the one the linker applied.
          codesign --force --sign - "$app/Contents/MacOS/rcrun"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"

      # Prove the claim rather than assert it: anything the package still needs
      # from the host has to be a system library, or the job fails here.
      - name: Verify the package carries its dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              ldd "dist/$PKG/PowerRustCOBOL" "dist/$PKG/rcrun"
              if ldd "dist/$PKG/PowerRustCOBOL" "dist/$PKG/rcrun" | grep -E 'libssl|libcrypto' >/dev/null; then
                echo "::error::OpenSSL is still linked dynamically — the package is not self-contained"
                exit 1
              fi
              ;;
            macOS)
              app="dist/$PKG/PowerRustCOBOL.app/Contents/MacOS"
              otool -L "$app/PowerRustCOBOL" "$app/rcrun"
              if otool -L "$app/PowerRustCOBOL" "$app/rcrun" | grep -E '/usr/local/|/opt/homebrew/' >/dev/null; then
                echo "::error::a Homebrew library leaked into the binary — it will not run on a clean Mac"
                exit 1
              fi
              ;;
            Windows)
              ls -l "dist/$PKG"/*.dll
              ;;
          esac

          # The assets the running app opens from beside its executable, and
          # the one it does not. Both directions matter: a missing theme pack
          # or screenshot is invisible until a user opens the form designer or
          # the documentation, and the knowledge store creeping back in is
          # invisible full stop — it just makes every download 8.5 MB bigger.
          if [ "$RUNNER_OS" = "macOS" ]; then
            res="dist/$PKG/PowerRustCOBOL.app/Contents/Resources"
          else
            res="dist/$PKG"
          fi
          for a in assets/themes assets/images/screenshots assets/animations assets/licenses; do
            test -d "$res/$a" || { echo "::error::the package is missing $a, which the app reads at run time"; exit 1; }
          done
          if [ -e "$res/assets/knowledge" ]; then
            echo "::error::assets/knowledge is back in the package — it is already \
          inside the binary (grace_host.rs PREBUILT_CHUNKED_KB) and nothing reads it from disk"
            exit 1
          fi

          # The SDK is what makes Build work on a machine with no source
          # checkout. Shipping without it is invisible until someone presses
          # Build, so it is checked here rather than discovered by a user.
          if [ "$RUNNER_OS" = "macOS" ]; then
            sdk="dist/$PKG/PowerRustCOBOL.app/Contents/Resources/sdk"
          else
            sdk="dist/$PKG/sdk"
          fi
          test -f "$sdk/Cargo.toml" || { echo "::error::the platform SDK is missing from the package"; exit 1; }
          for c in cobolt-ast cobolt-runtime cobolt-forms cobolt-form-host; do
            test -d "$sdk/crates/$c" || { echo "::error::the platform SDK is incomplete: crates/$c"; exit 1; }
          done

          # The example project, checked the same way and for the same reason:
          # a missing one is invisible until a user opens Help -> Examples and
          # finds it greyed out. The path is the one the IDE itself searches.
          if [ "$RUNNER_OS" = "macOS" ]; then
            ex="dist/$PKG/PowerRustCOBOL.app/Contents/Resources/examples"
          else
            ex="dist/$PKG/examples"
          fi
          test -f "$ex/PowerDemo3/PowerDemo3.project.toml" \
            || { echo "::error::the example project is missing from the package"; exit 1; }
          test -d "$ex/PowerDemo3/forms" \
            || { echo "::error::the example project is incomplete: forms/"; exit 1; }

      # ── Installers ──────────────────────────────────────────────────────────
      #
      # Built from the STAGED package, never from a fresh file list: the app
      # reads assets/, examples/, sdk/ and rcrun from beside its executable, and
      # a hand-written manifest that misses one of them is exactly how an
      # install ends up with no themes. Everything below wraps `dist/$PKG`,
      # which the steps above have already assembled and checked.
      #
      # They run BEFORE the archive steps, which delete that directory.
      #
      # None of this is signed. An installer is not inherently more trusted than
      # a zip: SmartScreen and Gatekeeper key off a paid certificate
      # (Authenticode; Apple Developer ID), so the same first-run warning
      # applies until the operator buys one. What an installer adds is the
      # install itself — Start Menu and Applications entries, a desktop file, an
      # uninstaller, and a path the platform's own tooling understands.

      # Windows: an MSI, because that is what a Windows shop deploys — silent
      # install (`msiexec /i … /quiet`), Add/Remove Programs, group policy.
      #
      # WiX is INSTALLED here rather than assumed: the toolset has come and gone
      # from the hosted images, and a build that depends on what happens to be
      # on the runner breaks without anyone changing it. `heat` harvests the
      # staged tree (every asset, example and SDK file), so nothing has to be
      # listed by hand.
      #
      # EVERY STRING IN THE WXS IS ASCII, deliberately. An MSI's summary
      # information is written in a legacy code page - 1252 unless the Product
      # declares otherwise - and `light` refuses anything it cannot represent
      # there. One em dash in the Package description was enough:
      # `error LGHT0311 : A string was provided with characters that are not
      # available in the specified database code page '1252'`, exit 55, no
      # installer. Prose belongs in these comments; the database gets plain
      # ASCII.
      # One mascot in, three images out — the two WiX bitmaps and the .dmg
      # background. Written in Rust and run from the workspace that was just
      # built, so it costs one small example compile and nothing is checked in
      # but `assets/images/chibi.png` itself. See the example's own header for
      # why the mascot sits left on one bitmap and right on the other.
      - name: Compose the installer artwork
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -p cobolt-media --example installer_art -- \
            assets/images/chibi.png dist/art
          ls -l dist/art

      - name: Build the installer (.msi)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install wixtoolset --no-progress -y
          wix="/c/Program Files (x86)/WiX Toolset v3.14/bin"
          test -d "$wix" || wix=$(ls -d "/c/Program Files (x86)/WiX Toolset v"*/bin | tail -1)
          test -x "$wix/heat.exe"

          # The product's identity. UpgradeCode is FIXED for the product's whole
          # life — it is what makes an install an UPGRADE of the last one rather
          # than a second copy beside it — while ProductId changes per version.
          cat > product.wxs <<'WXS'
          <?xml version="1.0" encoding="utf-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="PowerRustCOBOL" Language="1033" Version="$(var.Ver)"
                     Manufacturer="Emerson Lopes" UpgradeCode="6F3B1E4A-9C2D-4B77-8E51-2A6D0C9F41B3">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                       Platform="x64"
                       Description="PowerRustCOBOL AI - the next generation COBOL RAD IDE" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of PowerRustCOBOL is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="PowerRustCOBOL" />
                </Directory>
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="AppMenuFolder" Name="PowerRustCOBOL" />
                </Directory>
              </Directory>
              <DirectoryRef Id="AppMenuFolder">
                <Component Id="AppShortcut" Guid="*">
                  <Shortcut Id="StartMenuShortcut" Name="PowerRustCOBOL"
                            Description="The next generation COBOL RAD IDE"
                            Target="[INSTALLFOLDER]PowerRustCOBOL.exe"
                            WorkingDirectory="INSTALLFOLDER" />
                  <RemoveFolder Id="RemoveAppMenuFolder" On="uninstall" />
                  <RegistryValue Root="HKCU" Key="Software\PowerRustCOBOL"
                                 Name="installed" Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>
              <Feature Id="Complete" Level="1">
                <ComponentGroupRef Id="AppFiles" />
                <ComponentRef Id="AppShortcut" />
              </Feature>

              <!-- The finish page. Installing PowerRustCOBOL does not make a
                   machine able to BUILD with it, and the place to say so is
                   here rather than at the end of the developer's first build.
                   Windows wording only: a Mac or a Linux instruction shown to a
                   Windows user is noise they have to work out is not for them.

                   The checkbox is OFF by default and opens Microsoft's own
                   download page. It installs nothing by itself: the Build Tools
                   are a multi-gigabyte privileged install and that is the
                   user's decision to take, on Microsoft's page, not a box this
                   installer ticks for them. -->
              <!-- It opens Microsoft's page and installs nothing: the Build
                   Tools are a multi-gigabyte privileged install and that is the
                   user's call to make. -->
              <Property Id="WixShellExecTarget"
                        Value="https://visualstudio.microsoft.com/downloads/#build-tools-for-visual-studio-2022" />
              <CustomAction Id="OpenPrereqPage" BinaryKey="WixCA" DllEntry="WixShellExec"
                            Impersonate="yes" Return="ignore" />
              <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
              <WixVariable Id="WixUILicenseRtf" Value="license.rtf" />
              <WixVariable Id="WixUIBannerBmp" Value="dist/art/wix-banner.bmp" />
              <WixVariable Id="WixUIDialogBmp" Value="dist/art/wix-dialog.bmp" />

              <!-- ── The wizard ────────────────────────────────────────────
                   WixUI's own welcome and finish dialogs draw their text in
                   BLACK at x >= 180 px, which pins the artwork to a light panel
                   on the right and the mascot to the left. The look this
                   product wants is the other way round: dark edge to edge,
                   wordmark and copy in white on the LEFT, mascot on the right.
                   No property moves a stock control or recolours it, so the two
                   screens that carry the big bitmap are authored here. Every
                   other screen - licence, folder, ready, progress, the error
                   and maintenance dialogs - is WixUI's, unchanged, and reached
                   through the same sequence WixUI_InstallDir uses.

                   The text styles are new ids, not redefinitions: overriding
                   WixUI_Font_Normal would collide with the copy WixUI_Common
                   already defines. -->
              <UI Id="PrcUI">
                <TextStyle Id="PrcMark"  FaceName="Segoe UI" Size="17" Bold="yes" Red="255" Green="255" Blue="255" />
                <TextStyle Id="PrcSub"   FaceName="Consolas" Size="8"             Red="232" Green="130" Blue="46" />
                <TextStyle Id="PrcTitle" FaceName="Segoe UI" Size="12" Bold="yes" Red="255" Green="255" Blue="255" />
                <TextStyle Id="PrcBody"  FaceName="Segoe UI" Size="8"             Red="206" Green="194" Blue="184" />
                <TextStyle Id="PrcVer"   FaceName="Consolas" Size="8"             Red="132" Green="110" Blue="96" />

                <Property Id="DefaultUIFont" Value="WixUI_Font_Normal" />
                <Property Id="WixUI_Mode" Value="InstallDir" />

                <DialogRef Id="BrowseDlg" />
                <DialogRef Id="DiskCostDlg" />
                <DialogRef Id="ErrorDlg" />
                <DialogRef Id="FatalError" />
                <DialogRef Id="FilesInUse" />
                <DialogRef Id="MsiRMFilesInUse" />
                <DialogRef Id="PrepareDlg" />
                <DialogRef Id="ProgressDlg" />
                <DialogRef Id="ResumeDlg" />
                <DialogRef Id="UserExit" />

                <!-- Welcome. The bitmap is the whole 370x234 DU area; every
                     text control below sits on it with Transparent="yes" so the
                     artwork shows through, and each one names its own white
                     style inline with {\Style}. -->
                <Dialog Id="PrcWelcomeDlg" Width="370" Height="270" Title="[ProductName] Setup">
                  <Control Id="Bitmap" Type="Bitmap" X="0" Y="0" Width="370" Height="234"
                           TabSkip="no" Text="!(loc.WelcomeDlgBitmap)" />
                  <Control Id="Mark" Type="Text" X="18" Y="24" Width="180" Height="26"
                           Transparent="yes" NoPrefix="yes" Text="{\PrcMark}PowerRustCOBOL AI" />
                  <Control Id="Sub" Type="Text" X="18" Y="50" Width="180" Height="12"
                           Transparent="yes" NoPrefix="yes"
                           Text="{\PrcSub}THE NEXT GENERATION COBOL RAD IDE" />
                  <Control Id="Title" Type="Text" X="18" Y="96" Width="150" Height="42"
                           Transparent="yes" NoPrefix="yes"
                           Text="{\PrcTitle}Welcome to the [ProductName] Setup Wizard" />
                  <Control Id="Description" Type="Text" X="18" Y="146" Width="150" Height="50"
                           Transparent="yes" NoPrefix="yes"
                           Text="{\PrcBody}The Setup Wizard will install [ProductName] on your computer. Click Next to continue, or Cancel to exit." />
                  <Control Id="Ver" Type="Text" X="18" Y="208" Width="150" Height="12"
                           Transparent="yes" NoPrefix="yes" Text="{\PrcVer}[ProductVersion]" />
                  <Control Id="BottomLine" Type="Line" X="0" Y="234" Width="370" Height="0" />
                  <Control Id="Back" Type="PushButton" X="180" Y="243" Width="56" Height="17"
                           Disabled="yes" Text="!(loc.WixUIBack)" />
                  <Control Id="Next" Type="PushButton" X="236" Y="243" Width="56" Height="17"
                           Default="yes" Text="!(loc.WixUINext)" />
                  <Control Id="Cancel" Type="PushButton" X="304" Y="243" Width="56" Height="17"
                           Cancel="yes" Text="!(loc.WixUICancel)">
                    <Publish Event="SpawnDialog" Value="CancelDlg">1</Publish>
                  </Control>
                </Dialog>

                <!-- Finish. Same artwork, and the place the build prerequisites
                     are named - the one moment a developer is certain to read
                     something before their first build. -->
                <Dialog Id="PrcExitDlg" Width="370" Height="270" Title="[ProductName] Setup">
                  <Control Id="Bitmap" Type="Bitmap" X="0" Y="0" Width="370" Height="234"
                           TabSkip="no" Text="!(loc.WelcomeDlgBitmap)" />
                  <Control Id="Mark" Type="Text" X="18" Y="24" Width="180" Height="26"
                           Transparent="yes" NoPrefix="yes" Text="{\PrcMark}PowerRustCOBOL AI" />
                  <Control Id="Sub" Type="Text" X="18" Y="50" Width="180" Height="12"
                           Transparent="yes" NoPrefix="yes"
                           Text="{\PrcSub}THE NEXT GENERATION COBOL RAD IDE" />
                  <Control Id="Title" Type="Text" X="18" Y="88" Width="150" Height="26"
                           Transparent="yes" NoPrefix="yes"
                           Text="{\PrcTitle}Installation complete" />
                  <Control Id="Description" Type="Text" X="18" Y="116" Width="152" Height="90"
                           Transparent="yes" NoPrefix="yes"
                           Text="{\PrcBody}To BUILD applications you also need two things Rust requires: the Visual Studio Build Tools with the &quot;Desktop development with C++&quot; workload, and Rust itself from https://rustup.rs.  Designing forms, editing code and running programs work without either." />
                  <Control Id="BottomLine" Type="Line" X="0" Y="234" Width="370" Height="0" />
                  <Control Id="Back" Type="PushButton" X="180" Y="243" Width="56" Height="17"
                           Disabled="yes" Text="!(loc.WixUIBack)" />
                  <!-- A button, not a checkbox. A CheckBox control cannot carry
                       `Transparent`/`NoPrefix` - those are Text-only attributes,
                       and candle rejects them outright (CNDL0004, run 19) - so on
                       this dark artwork a checkbox would paint an opaque system
                       box around its own label. A button belongs on the button
                       strip, below the bitmap, where an opaque control is what
                       the eye expects; it also acts when it is pressed rather
                       than only if the user later presses Finish. -->
                  <Control Id="Prereq" Type="PushButton" X="18" Y="243" Width="120" Height="17"
                           Text="Build Tools download page">
                    <Publish Event="DoAction" Value="OpenPrereqPage">NOT Installed</Publish>
                  </Control>
                  <Control Id="Finish" Type="PushButton" X="236" Y="243" Width="56" Height="17"
                           Default="yes" Cancel="yes" Text="!(loc.WixUIFinish)">
                    <Publish Event="EndDialog" Value="Return">1</Publish>
                  </Control>
                  <Control Id="Cancel" Type="PushButton" X="304" Y="243" Width="56" Height="17"
                           Disabled="yes" Text="!(loc.WixUICancel)" />
                </Dialog>

                <!-- The sequence, as WixUI_InstallDir runs it, with our two
                     dialogs standing in for WelcomeDlg and ExitDialog. -->
                <Publish Dialog="BrowseDlg" Control="OK" Event="DoAction" Value="WixUIValidatePath" Order="3">1</Publish>
                <Publish Dialog="BrowseDlg" Control="OK" Event="SpawnDialog" Value="InvalidDirDlg" Order="4"><![CDATA[WIXUI_INSTALLDIR_VALID<>"1"]]></Publish>

                <Publish Dialog="PrcWelcomeDlg" Control="Next" Event="NewDialog" Value="LicenseAgreementDlg">NOT Installed</Publish>
                <Publish Dialog="PrcWelcomeDlg" Control="Next" Event="NewDialog" Value="VerifyReadyDlg">Installed AND PATCH</Publish>

                <Publish Dialog="LicenseAgreementDlg" Control="Back" Event="NewDialog" Value="PrcWelcomeDlg">1</Publish>
                <Publish Dialog="LicenseAgreementDlg" Control="Next" Event="NewDialog" Value="InstallDirDlg">LicenseAccepted = "1"</Publish>

                <Publish Dialog="InstallDirDlg" Control="Back" Event="NewDialog" Value="LicenseAgreementDlg">1</Publish>
                <Publish Dialog="InstallDirDlg" Control="Next" Event="SetTargetPath" Value="[WIXUI_INSTALLDIR]" Order="1">1</Publish>
                <Publish Dialog="InstallDirDlg" Control="Next" Event="DoAction" Value="WixUIValidatePath" Order="2">NOT WIXUI_DONTVALIDATEPATH</Publish>
                <Publish Dialog="InstallDirDlg" Control="Next" Event="SpawnDialog" Value="InvalidDirDlg" Order="3"><![CDATA[NOT WIXUI_DONTVALIDATEPATH AND WIXUI_INSTALLDIR_VALID<>"1"]]></Publish>
                <Publish Dialog="InstallDirDlg" Control="Next" Event="NewDialog" Value="VerifyReadyDlg" Order="4">WIXUI_DONTVALIDATEPATH OR WIXUI_INSTALLDIR_VALID="1"</Publish>
                <Publish Dialog="InstallDirDlg" Control="ChangeFolder" Property="_BrowseProperty" Value="[WIXUI_INSTALLDIR]" Order="1">1</Publish>
                <Publish Dialog="InstallDirDlg" Control="ChangeFolder" Event="SpawnDialog" Value="BrowseDlg" Order="2">1</Publish>

                <Publish Dialog="VerifyReadyDlg" Control="Back" Event="NewDialog" Value="InstallDirDlg" Order="1">NOT Installed</Publish>
                <Publish Dialog="VerifyReadyDlg" Control="Back" Event="NewDialog" Value="MaintenanceTypeDlg" Order="2">Installed AND NOT PATCH</Publish>
                <Publish Dialog="VerifyReadyDlg" Control="Back" Event="NewDialog" Value="PrcWelcomeDlg" Order="2">Installed AND PATCH</Publish>

                <Publish Dialog="MaintenanceWelcomeDlg" Control="Next" Event="NewDialog" Value="MaintenanceTypeDlg">1</Publish>
                <Publish Dialog="MaintenanceTypeDlg" Control="RepairButton" Event="NewDialog" Value="VerifyReadyDlg">1</Publish>
                <Publish Dialog="MaintenanceTypeDlg" Control="RemoveButton" Event="NewDialog" Value="VerifyReadyDlg">1</Publish>
                <Publish Dialog="MaintenanceTypeDlg" Control="Back" Event="NewDialog" Value="MaintenanceWelcomeDlg">1</Publish>

                <!-- Ours replaces WixUI_Common's, which declares its own Show
                     as overridable for exactly this. -->
                <InstallUISequence>
                  <Show Dialog="PrcWelcomeDlg" Before="ProgressDlg">NOT Installed</Show>
                  <Show Dialog="PrcExitDlg" OnExit="success" />
                </InstallUISequence>
              </UI>
              <UIRef Id="WixUI_Common" />
            </Product>
          </Wix>
          WXS

          test -s dist/art/wix-dialog.bmp && test -s dist/art/wix-banner.bmp
          # The licence screen needs the licence as RTF. Generated
          # from the LICENSE this repository already ships rather than kept as a
          # second copy that could drift from it. Apache-2.0 is pure ASCII, so
          # the only escaping RTF needs is its own three metacharacters.
          {
            printf '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0\\fnil Segoe UI;}}\\fs18 '
            sed -e 's/\\/\\\\/g' -e 's/{/\\{/g' -e 's/}/\\}/g' LICENSE \
              | sed -e 's/$/\\par/'
            printf '}'
          } > license.rtf
          test -s license.rtf

          "$wix/heat.exe" dir "dist/$PKG" -cg AppFiles -gg -scom -sreg -sfrag -srd \
            -dr INSTALLFOLDER -var var.SourceDir -out appfiles.wxs
          # -arch x64 is not cosmetic: it marks every harvested component 64-bit,
          # and without it Windows redirects ProgramFiles64Folder and a 64-bit
          # application installs itself into "Program Files (x86)" — which is
          # exactly where 1.65.108 put it (operator, 2026-09-10).
          "$wix/candle.exe" -arch x64 -ext WixUIExtension -ext WixUtilExtension \
            -dVer="$VERSION" -dSourceDir="dist/$PKG" product.wxs appfiles.wxs
          "$wix/light.exe" -sval -ext WixUIExtension -ext WixUtilExtension \
            product.wixobj appfiles.wixobj -o "dist/${PKG}.msi"
          test -s "dist/${PKG}.msi"

      # macOS: a .dmg with the app and a link to /Applications — the drag-here
      # window every Mac user already knows. Only the bundle goes in: the
      # archive's loose `rcrun` is a symlink INTO it, and the IDE finds its own
      # copy beside its executable.
      - name: Build the installer (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          vol="PowerRustCOBOL $VERSION"
          stage=$(mktemp -d)/PowerRustCOBOL
          mkdir -p "$stage/.background"
          cp -R "dist/$PKG/PowerRustCOBOL.app" "$stage/PowerRustCOBOL.app"
          ln -s /Applications "$stage/Applications"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$stage/"
          cp dist/art/dmg-background.png "$stage/.background/background.png"

          # Built writable first: the window layout below is Finder state that
          # has to be written INTO the image, and a compressed image is
          # read-only. It is converted at the end.
          hdiutil create -volname "$vol" -srcfolder "$stage" -ov \
            -format UDRW "dist/_rw.dmg"
          # Mounted WITHOUT -mountpoint, and this matters: Finder can only
          # address a volume as `disk "Name"` when it is at /Volumes/Name, so
          # sending it to a temp directory makes the layout below fail with
          # "Can't get disk" — which is exactly what the first attempt did.
          # macOS also renames a clashing volume, so the real name is read back
          # from what attach reports rather than assumed.
          mnt=$(hdiutil attach "dist/_rw.dmg" -nobrowse | grep -o '/Volumes/.*' | tail -1)
          volname=$(basename "$mnt")
          echo "mounted as $mnt"

          # The window: 1100x800, the artwork behind it, and the two icons on
          # the light half where Finder's own dark labels can be read. The
          # positions match the chevron baked into the background, which is why
          # they are written here rather than left to Finder's defaults.
          #
          # Best-effort on purpose. Finder scripting needs a logged-in session,
          # and a runner that has not got one must still produce a usable .dmg —
          # an unstyled disk image installs exactly as well as a styled one.
          # Run under a watchdog. Finder scripting can block indefinitely
          # waiting on an automation-permission prompt that a headless runner
          # will never answer — tried on a developer Mac, this exact script sat
          # there until it was killed. Without the watchdog that becomes a
          # two-hour job timeout instead of a warning.
          scpt=$(mktemp)
          cat > "$scpt" <<APPLESCRIPT
          tell application "Finder"
            tell disk "$volname"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {120, 100, 1220, 900}
              set opts to the icon view options of container window
              set arrangement of opts to not arranged
              set icon size of opts to 128
              set text size of opts to 13
              set background picture of opts to file ".background:background.png"
              set position of item "PowerRustCOBOL.app" of container window to {250, 400}
              set position of item "Applications" of container window to {500, 400}
              set position of item "LICENSE" of container window to {980, 660}
              set position of item "NOTICE" of container window to {980, 660}
              set position of item "THIRD_PARTY_NOTICES.md" of container window to {980, 660}
              set position of item "README.md" of container window to {980, 660}
              close
              open
              update without registering applications
              delay 3
            end tell
          end tell
          APPLESCRIPT
          osascript "$scpt" & osa=$!
          ( sleep 120; kill -9 $osa 2>/dev/null ) & dog=$!
          if wait $osa; then
            echo "window layout applied"
          else
            echo "::warning::Finder would not lay the window out; shipping an unstyled .dmg"
          fi
          kill $dog 2>/dev/null || true
          rm -f "$scpt"

          sync
          # Finder does not let go the instant the script does. Run 19 detached
          # cleanly on arm64 and lost the same race on x86_64 with
          # `couldn't eject "disk2" - Resource busy`, which is a race, not a
          # fault: retry, and only then force. Forcing first would risk
          # detaching before the layout has been flushed to the image.
          for attempt in 1 2 3 4 5 6; do
            if hdiutil detach "$mnt" >/dev/null 2>&1; then
              echo "detached on attempt $attempt"
              mnt=""
              break
            fi
            sleep 3
          done
          if [ -n "$mnt" ]; then
            echo "::warning::volume still busy after 18s; forcing the detach"
            hdiutil detach "$mnt" -force
          fi
          hdiutil convert "dist/_rw.dmg" -format UDZO -ov -o "dist/${PKG}.dmg"
          rm -f "dist/_rw.dmg"
          test -s "dist/${PKG}.dmg"

          # ── The licence, and having to agree to it ──────────────────────────
          #
          # A .dmg has no wizard to put a licence screen in, so it carries the
          # agreement as a resource instead and macOS itself refuses to mount
          # the volume until Agree is clicked. That is the only place on this
          # platform where acceptance can be REQUIRED rather than merely
          # offered.
          #
          # The three resources are the classic ones, and two of them are fixed
          # blobs rather than anything this workflow computes:
          #   LPic  one language, English, pointing at resource 5000
          #   STR#  the button labels and the prompt, as Pascal strings
          #   TEXT  the licence, CR-terminated the way the resource expects
          lpic="AAAAAAABAAATiAAA"
          strn="AAYHRW5nbGlzaAVBZ3JlZQhEaXNhZ3JlZQVQcmludAdTYXZlLi4ue0lmIHlvdSBhZ3JlZSB3aXRoIHRoZSB0ZXJtcyBvZiB0aGlzIGxpY2Vuc2UsIHByZXNzICJBZ3JlZSIgdG8gaW5zdGFsbCB0aGUgc29mdHdhcmUuICBJZiB5b3UgZG8gbm90IGFncmVlLCBwcmVzcyAiRGlzYWdyZWUiLg=="
          tr '\n' '\r' < LICENSE | base64 > dist/_lic.b64
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo "<key>LPic</key><array><dict><key>Attributes</key><string>0x0000</string>"
            echo "<key>Data</key><data>$lpic</data><key>ID</key><string>5000</string>"
            echo "<key>Name</key><string></string></dict></array>"
            echo "<key>STR#</key><array><dict><key>Attributes</key><string>0x0000</string>"
            echo "<key>Data</key><data>$strn</data><key>ID</key><string>5000</string>"
            echo "<key>Name</key><string>English</string></dict></array>"
            echo "<key>TEXT</key><array><dict><key>Attributes</key><string>0x0000</string>"
            echo "<key>Data</key><data>"; cat dist/_lic.b64; echo "</data>"
            echo "<key>ID</key><string>5000</string>"
            echo "<key>Name</key><string>English</string></dict></array>"
            echo '</dict></plist>'
          } > dist/_sla.plist
          plutil -lint dist/_sla.plist
          hdiutil udifrez -xml dist/_sla.plist '' "dist/${PKG}.dmg"
          rm -f dist/_sla.plist dist/_lic.b64

          # The bundle must survive the round trip intact — a dmg that carries a
          # broken signature is one Gatekeeper refuses outright, which is worse
          # than the warning an unsigned one earns.
          #
          # Attached WITHOUT piping anything in. An agreement-bearing image
          # mounts unattended when stdout is not a terminal, and `yes |` here
          # would hand the step a SIGPIPE under `pipefail` — the same trap that
          # cost three runs on the .deb.
          mnt2=$(mktemp -d)
          hdiutil attach "dist/${PKG}.dmg" -nobrowse -readonly -mountpoint "$mnt2"
          codesign --verify --strict "$mnt2/PowerRustCOBOL.app"
          test -d "$mnt2/PowerRustCOBOL.app/Contents/Resources/assets/themes"
          test -f "$mnt2/PowerRustCOBOL.app/Contents/Resources/sdk/Cargo.toml"
          test -f "$mnt2/.background/background.png"
          hdiutil detach "$mnt2"

      # The desktop entry and the launcher paths both Linux packages install.
      # Written once here rather than twice below: a menu entry that differs
      # between the .deb and the .rpm is a difference nobody would notice until
      # a user on one distro reported a missing icon.
      - name: Stage the Linux desktop entry
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          cat > dist/linux/powerrustcobol.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=PowerRustCOBOL
          Comment=The next generation COBOL RAD IDE
          Exec=/opt/powerrustcobol/PowerRustCOBOL
          Icon=powerrustcobol
          Terminal=false
          Categories=Development;IDE;
          DESKTOP
          cp assets/images/powerrustcobol-icon.png dist/linux/powerrustcobol.png

      # Linux: a .deb, which is what the largest family of desktops installs
      # with a double-click and what `apt` can remove again. The tree goes to
      # /opt (it is a self-contained application directory, not a set of files
      # belonging in /usr), with the launcher and the menu entry pointing at it.
      - name: Build the installer (.deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Three runs were spent blaming this step's BUILD. It was never the build.
          # `dpkg-deb --build` has succeeded every time; the `tar: stdout: write
          # error` came from the VERIFICATION at the bottom of this step, where
          # `dpkg-deb -c | grep -q` ran under `set -o pipefail`. Run 16 proved it:
          # the `df -h /` below only runs AFTER a successful build, and it printed
          # 1 GB more used — the package — before the error appeared.
          #
          # So disk was not the cause (83 GB free), memory was not the cause (15 GB
          # available, 4 cores), and the compressor was not the cause (xz, gzip and
          # none all behaved identically). Three theories, all tested against a step
          # that was already doing its job. Recorded here so nobody spends a fourth
          # run on them.
          #
          # The payload is HARDLINKED rather than copied (`cp -al`): dpkg-deb reads
          # through the links exactly as it would through copies, and the tree costs
          # inodes instead of a second 400 MB. The package root sits inside the
          # workspace so it is certainly on the same filesystem as `dist/` —
          # hardlinks cannot cross one.
          df -h /
          root=dist/debroot
          rm -rf "$root"
          install -d "$root/DEBIAN" "$root/opt/powerrustcobol" \
            "$root/usr/bin" "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/256x256/apps"
          cp -al "dist/$PKG/." "$root/opt/powerrustcobol/"
          # Debian's own size field, in KiB, as the archive tools report it.
          size=$(du -sk "$root/opt" | cut -f1)
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: powerrustcobol
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Emerson Lopes <emersonlopes@gmail.com>
          Installed-Size: $size
          Suggests: build-essential
          Description: PowerRustCOBOL AI - the next generation COBOL RAD IDE
           Design forms visually, run them on a fast tree-walking COBOL-85
           runtime, and compile to a single self-contained binary. Ships with
           rcrun, the command-line runtime.
          CONTROL

          # `Suggests` rather than `Depends` or `Recommends`, deliberately.
          # Designing forms and running programs need nothing beyond this
          # package; only BUILD does. A Depends would force a compiler on every
          # user, and a Recommends would install one without being asked —
          # neither is honest about a prerequisite that half the users never
          # reach. Suggests says it, installs nothing, and apt shows it.
          #
          # What Suggests cannot do is explain itself, so the postinst does.
          # Debian and Ubuntu wording only: this package is never installed on a
          # Mac or a Fedora machine, and instructions for those would be noise
          # the reader has to work out are not for them.
          cat > "$root/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if [ "$1" = configure ]; then
            cat <<'MSG'

          PowerRustCOBOL AI is installed. Designing forms, editing code and
          running programs are ready to use and need nothing else.

          BUILD compiles your project into a native application, and for that it
          needs two more things:

            sudo apt install build-essential      # the linker Rust drives
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh

          PowerRustCOBOL checks both the first time it starts and offers to
          install Rust for you. Installing build-essential is left to you: it is
          a system package, and apt is already in your hands.

          MSG
          fi
          exit 0
          POSTINST
          chmod 0755 "$root/DEBIAN/postinst"

          # Debian policy: every package carries its licence at this exact
          # path. There is no installer window on Linux to show it in, so on
          # disk is the only place it can be, and this is the place every
          # Debian user already knows to look.
          install -d "$root/usr/share/doc/powerrustcobol"
          cp LICENSE "$root/usr/share/doc/powerrustcobol/copyright"

          ln -s /opt/powerrustcobol/PowerRustCOBOL "$root/usr/bin/powerrustcobol"
          ln -s /opt/powerrustcobol/rcrun "$root/usr/bin/rcrun"
          cp dist/linux/powerrustcobol.png \
            "$root/usr/share/icons/hicolor/256x256/apps/powerrustcobol.png"
          cp dist/linux/powerrustcobol.desktop \
            "$root/usr/share/applications/powerrustcobol.desktop"

          # Default compression, which is xz — what a Debian package normally uses,
          # and this is the download people fetch. The `-Znone` that briefly stood
          # here was a probe, not a decision.
          dpkg-deb --root-owner-group --build "$root" "dist/${PKG}.deb"
          test -s "dist/${PKG}.deb"
          df -h /
          # Prove the tree the app actually reads survived the packaging, the same
          # way the archive is checked.
          #
          # The listing is taken ONCE into a file and grepped there. Piping
          # `dpkg-deb -c` straight into `grep -q` is what broke this step for three
          # runs: grep leaves on its first match, dpkg-deb's tar is left writing to a
          # closed pipe, and `pipefail` fails the step over a check that PASSED.
          # Never pipe a long listing into an early-exiting reader under pipefail.
          dpkg-deb -c "dist/${PKG}.deb" > dist/_deb-contents.txt
          grep -q "./opt/powerrustcobol/assets/themes/" dist/_deb-contents.txt
          grep -q "./opt/powerrustcobol/sdk/Cargo.toml" dist/_deb-contents.txt
          grep -q "./opt/powerrustcobol/examples/PowerDemo3/" dist/_deb-contents.txt
          rm -f dist/_deb-contents.txt
          # The links have done their job; the .rpm needs the room next.
          rm -rf "$root"

      # …and an .rpm, so the other half of the Linux desktop world has an
      # installer too rather than only the tarball: Fedora, RHEL, CentOS Stream,
      # openSUSE. Same tree, same launchers, same menu entry — the .deb and this
      # differ only in the packaging format.
      #
      # Three settings make rpmbuild accept a payload it did not compile.
      # `__os_install_post` off keeps it from stripping binaries it has no
      # sources for; `debug_package` off stops it demanding a debuginfo package
      # from them; `AutoReqProv: no` stops it deriving dependencies by reading
      # every shared object in the tree, which would pin the package to the
      # exact library versions of the machine that BUILT it — the opposite of
      # what a self-contained bundle wants.
      - name: Build the installer (.rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends rpm
          top=$PWD/dist/rpmbuild
          rm -rf "$top"
          mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}
          cat > "$top/SPECS/powerrustcobol.spec" <<'SPEC'
          %global __os_install_post %{nil}
          %global debug_package %{nil}
          # gzip for the same reason the .deb uses it: rpm's default xz payload
          # is the memory-hungry part of packaging 400 MB, and a download that
          # is a few per cent larger is the cheaper trade.
          %global _binary_payload w6.gzdio
          Name:           powerrustcobol
          Version:        %{ver}
          Release:        1
          Summary:        PowerRustCOBOL AI - the next generation COBOL RAD IDE
          License:        Apache-2.0
          URL:            https://github.com/CloudLandBeta/PowerRustCOBOL
          BuildArch:      x86_64
          AutoReqProv:    no
          # Weak, for the reason the .deb uses Suggests: only BUILD needs a
          # compiler, and forcing one on every user who wants to design forms
          # would be wrong. gcc is what carries the linker here.
          Suggests:       gcc

          %description
          Design forms visually, run them on a fast tree-walking COBOL-85
          runtime, and compile to a single self-contained binary. Ships with
          rcrun, the command-line runtime.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/opt/powerrustcobol %{buildroot}/usr/bin \
                   %{buildroot}/usr/share/applications \
                   %{buildroot}/usr/share/licenses/powerrustcobol \
                   %{buildroot}/usr/share/icons/hicolor/256x256/apps
          # Where an RPM-based distribution looks for a package's licence, and
          # the only place it can be: Linux has no installer window to show it in.
          install -m 0644 %{srcdir}/LICENSE \
            %{buildroot}/usr/share/licenses/powerrustcobol/LICENSE
          cp -al %{srcdir}/. %{buildroot}/opt/powerrustcobol/
          ln -s /opt/powerrustcobol/PowerRustCOBOL %{buildroot}/usr/bin/powerrustcobol
          ln -s /opt/powerrustcobol/rcrun %{buildroot}/usr/bin/rcrun
          install -m 0644 %{deskdir}/powerrustcobol.desktop \
            %{buildroot}/usr/share/applications/powerrustcobol.desktop
          install -m 0644 %{deskdir}/powerrustcobol.png \
            %{buildroot}/usr/share/icons/hicolor/256x256/apps/powerrustcobol.png

          # Fedora and RHEL wording only - an apt line or an xcode-select line
          # shown here is noise the reader has to work out is not for them.
          %post
          cat <<'MSG'

          PowerRustCOBOL AI is installed. Designing forms, editing code and
          running programs are ready to use and need nothing else.

          BUILD compiles your project into a native application, and for that it
          needs two more things:

            sudo dnf group install "Development Tools"   # the linker Rust drives
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh

          PowerRustCOBOL checks both the first time it starts and offers to
          install Rust for you. The development tools are left to you: they are
          system packages, and dnf is already in your hands.

          MSG
          exit 0

          %files
          %license /usr/share/licenses/powerrustcobol/LICENSE
          /opt/powerrustcobol
          /usr/bin/powerrustcobol
          /usr/bin/rcrun
          /usr/share/applications/powerrustcobol.desktop
          /usr/share/icons/hicolor/256x256/apps/powerrustcobol.png
          SPEC

          # Same rule as the .deb: _topdir inside the workspace, so the
          # buildroot's hardlinks land on the filesystem `dist/` is on.
          df -h /; free -m
          rpmbuild -bb "$top/SPECS/powerrustcobol.spec" \
            --define "_topdir $top" \
            --define "ver $VERSION" \
            --define "srcdir $PWD/dist/$PKG" \
            --define "deskdir $PWD/dist/linux"
          # `find | head -1` is the same SIGPIPE trap the .deb verification fell into;
          # -quit makes find stop by itself, with nothing to close a pipe on it.
          built=$(find "$top/RPMS" -name '*.rpm' -print -quit)
          test -s "$built"
          cp "$built" "dist/${PKG}.rpm"
          # The same three checks the .deb makes, against the payload rpm actually
          # recorded — and, like the .deb, against a listing taken ONCE into a file
          # rather than piped into `grep -q`.
          rpm -qlp "dist/${PKG}.rpm" > dist/_rpm-contents.txt
          grep -q "^/opt/powerrustcobol/assets/themes/" dist/_rpm-contents.txt
          grep -q "^/opt/powerrustcobol/sdk/Cargo.toml$" dist/_rpm-contents.txt
          grep -q "^/opt/powerrustcobol/examples/PowerDemo3/" dist/_rpm-contents.txt
          rm -f dist/_rpm-contents.txt
          # Nothing below needs the build tree or the staged desktop entry, and
          # the artifact upload takes all of dist/.
          rm -rf "$top" dist/linux
          df -h /

      # Artifact zips drop the Unix executable bit and flatten symlinks; a
      # tarball keeps both, so the app bundle survives the download intact.
      - name: Archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/${PKG}.tar.gz" "$PKG"
          rm -rf "dist/${PKG:?}"

      # Windows gets a plain zip, so every platform leaves exactly one archive
      # in dist/ for the release job to attach.
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"
          Remove-Item -Recurse -Force "dist/$env:PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: dist/
          if-no-files-found: error

  # The public download page. Actions artifacts need a GitHub account and
  # expire; a release is permanent, anonymous and linkable, which is what a
  # download has to be. `needs: build` means one broken platform publishes
  # nothing — a release either offers every machine a download or it waits.
  release:
    name: Publish the downloads
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/incoming
          merge-multiple: true

      # Staged outside the checkout on purpose. The repository has its own
      # assets/ directory, and staging under that name once handed the release
      # 100 MB of theme images instead of the packages.
      - name: Collect the assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";/\1/p' crates/cobolt-ide/src/version.rs)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          packages="$RUNNER_TEMP/packages"
          mkdir -p "$packages"
          find "$RUNNER_TEMP/incoming" -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec mv -t "$packages/" {} +
          # Every platform must have contributed BOTH its archive and its
          # installer. A release that quietly offers four downloads where it
          # should offer eight is the failure this catches: the installer steps
          # are new, and a silently missing one looks exactly like a platform
          # nobody built for.
          for want in msi dmg deb rpm; do
            ls "$packages"/*."$want" >/dev/null 2>&1 \
              || { echo "::error::no .$want installer reached the release"; exit 1; }
          done
          ( cd "$packages" && sha256sum * ) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$packages/"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
          ls -lh "$packages"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          TITLE_INPUT: ${{ inputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-}"
          tag="${tag:-v$VERSION}"
          title="${TITLE_INPUT:-}"
          title="${title:-PowerRustCOBOL $VERSION}"

          # Releases in this repository are IMMUTABLE: publishing freezes the
          # assets and burns the tag for good, so an existing one is never
          # amended. Say so and stop, rather than fail obscurely inside gh.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release already exists on tag $tag, and releases here are \
          immutable — publish under a different tag"
            exit 1
          fi

          printf '%s\n' \
            "PowerRustCOBOL $VERSION — the RAD IDE, and rcrun, the RustCOBOL command-line runtime." \
            "" \
            "Download the archive for your machine, unpack it anywhere and run it. Each one carries what its platform needs, so there is nothing to install first." \
            "" \
            "**Installers** — double-click, and it is installed." \
            "" \
            "| Download | For |" \
            "| --- | --- |" \
            "| PowerRustCOBOL-$VERSION-macos-aarch64.dmg | Macs with Apple Silicon |" \
            "| PowerRustCOBOL-$VERSION-macos-x86_64.dmg | Intel Macs |" \
            "| PowerRustCOBOL-$VERSION-windows-x86_64.msi | Windows 10 and 11, 64-bit |" \
            "| PowerRustCOBOL-$VERSION-linux-x86_64.deb | Debian, Ubuntu, Mint and relatives |" \
            "| PowerRustCOBOL-$VERSION-linux-x86_64.rpm | Fedora, RHEL, CentOS Stream, openSUSE |" \
            "" \
            "**Archives** — unpack anywhere and run, nothing installed. Use one of these on a Linux that is not Debian-based, or where you cannot install software." \
            "" \
            "| Download | For |" \
            "| --- | --- |" \
            "| PowerRustCOBOL-$VERSION-macos-aarch64.tar.gz | Macs with Apple Silicon |" \
            "| PowerRustCOBOL-$VERSION-macos-x86_64.tar.gz | Intel Macs |" \
            "| PowerRustCOBOL-$VERSION-windows-x86_64.zip | Windows 10 and 11, 64-bit |" \
            "| PowerRustCOBOL-$VERSION-linux-x86_64.tar.gz | Linux 64-bit, any desktop |" \
            "" \
            "SHA256SUMS lists the checksum of every archive." \
            "" \
            "First run on macOS: the app is not notarised, so macOS quarantines what you downloaded. Right-click PowerRustCOBOL.app and choose Open, or clear it with: xattr -dr com.apple.quarantine PowerRustCOBOL.app" \
            "" \
            "First run on Windows: the executable is unsigned, so SmartScreen warns once. Choose More info, then Run anyway." \
            "" \
            "Linux needs glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+) and the OpenGL, X11 or Wayland libraries your desktop already provides." \
            > "$RUNNER_TEMP/notes.md"

          # Draft first, files second, publish last. An immutable release takes
          # no assets once it is public, so everything has to be attached while
          # it is still a draft — and a run that dies midway then leaves a
          # draft nobody can download, rather than a public half-release whose
          # tag is already spent.
          gh release create "$tag" "$PACKAGES"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url
