# Cobalt Steel — engine manifest (007). Bridge form: framed controls map to the
# pack's composited *_ref.png 9-slice tiles. Sprite/composite controls (checkbox,
# radio, slider, combobox, …) await the Phase 6 parts/sprite engine and fall back
# to Liquid Glass for now. Original descriptive manifest kept as theme.agent.toml.
id = "cobalt-steel"
display_name = "Cobalt Steel"

[background]
image = "background.png"
tile = false

[palette]
foreground = "#dfe7ff"
chart = ["#2D6FE8", "#BC35DD", "#24C79B", "#E46F38", "#80D7FF", "#F05FA6"]

[chart_style]
stroke_width = 2.0
fill_texture = "chart_fill.png"

[controls.button]
slice = [54, 54, 54, 54]
image = "button/button_normal_ref.png"
hover = "button/button_hover_ref.png"
pressed = "button/button_pressed_ref.png"
disabled = "button/button_disabled_ref.png"
focused = "button/button_focused_ref.png"

[controls.panel]
slice = [84, 84, 84, 84]
image = "panel/panel_normal_ref.png"

[controls.groupbox]
slice = [84, 84, 84, 84]
image = "groupbox/groupbox_normal_ref.png"

[controls.textbox]
slice = [36, 36, 36, 36]
image = "textbox/textbox_normal_ref.png"
disabled = "textbox/textbox_disabled_ref.png"
focused = "textbox/textbox_focused_ref.png"

[controls.listbox]
