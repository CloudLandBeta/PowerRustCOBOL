# Reference asset-pack theme (spec 007). Procedurally generated by
# `cargo run -p cobolt-forms --example gen_reference_theme` — original work, no
# external artwork (R16). Proves the 9-slice engine end-to-end.
id = "cobalt-steel"
display_name = "Cobalt Steel (reference)"

[background]
image = "background.png"
tile = false

[palette]
foreground = "#e7eeff"
chart = ["#5A6EA8", "#8FB0FF", "#4CC8E8", "#C88FFF"]

[chart_style]
stroke_width = 2.5

[controls.panel]
image = "panel.png"
slice = [14, 14, 14, 14]

[controls.groupbox]
image = "groupbox.png"
slice = [14, 14, 14, 14]

[controls.button]
image = "button.png"
slice = [12, 12, 12, 12]
hover = "button_hover.png"
pressed = "button_pressed.png"

[controls.textbox]
image = "textbox.png"
slice = [8, 8, 8, 8]

[controls.combobox]
image = "combobox.png"
slice = [8, 8, 8, 8]

[controls.listbox]
image = "listbox.png"
slice = [7, 7, 7, 7]
