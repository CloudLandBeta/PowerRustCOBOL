# Neumorphic — soft extruded 3D UI style (spec 007).
# Classic neumorphism: elements appear raised or inset from the background
# with soft shadows and highlights, minimal borders, rounded corners.
# Light mode by default for the soft "clay" or "soft UI" feel.
# Palette and style tuned for professional COBOL forms.
#
# ── Which images this points at, and why it matters ──────────────────────────
#
# The `<control>/…_ref.png` files in this folder are DESIGN REFERENCES — full
# mock-ups of a finished control, several hundred pixels wide, with placeholder
# text drawn INTO the picture. They are not 9-slice tiles and must never be
# used as skins: stretching one across a button paints its fake text inside
# every caption, which is exactly what shipped until 2026-08-21.
#
# The skins are the small tiles at the top level of this folder — the same
# convention `cobalt-steel/theme.toml` uses. A control with no tile here is
# simply not listed, and Liquid Glass paints it (spec 007 R11 fallback), which
# is a better answer than a stretched mock-up.
id = "neumorphic"
display_name = "Neumorphic"

# The one asset that is genuinely this pack's own: a soft light clay surface.
# The dark slate `foreground` below is chosen to read on IT — a form that opts
# into this background with `UseThemeBackground` gets the pairing the pack was
# designed around.
[background]
image = "background.png"
tile = false

[palette]
foreground = "#2c3e50"
chart = ["#5d6d7e", "#7f8c8d", "#95a5a6", "#bdc3c7"]

[chart_style]
stroke_width = 2.0

[controls.panel]
image = "panel.png"
slice = [14, 14, 14, 14]

[controls.groupbox]
image = "groupbox.png"
slice = [14, 14, 14, 14]

[controls.button]
image = "button.png"
slice = [12, 12, 12, 12]
hover = "button_hover.png"
pressed = "button_pressed.png"

[controls.textbox]
image = "textbox.png"
slice = [8, 8, 8, 8]

[controls.combobox]
image = "combobox.png"
slice = [8, 8, 8, 8]

[controls.listbox]
image = "listbox.png"
slice = [7, 7, 7, 7]
