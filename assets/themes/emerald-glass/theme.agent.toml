name = "emerald-glass"
scale = 3
material = "modern glassmorphism (dark green glass, frosted, with subtle reflections)"

[background]
mode = "stretch"
file = "background.png"

[chart_style]
stroke_width = 2
fill_texture = "chart_fill.png"

[palette]
foreground = "#a8ff9e"
chart = ["#a8ff9e", "#f4e26e", "#5de2a6", "#b8ff6e", "#7be8b8", "#e8f46e"]

[grain]
top_bottom_edges = "soft frosted horizontal glass edges"
left_right_edges = "vertical glass grain with light refraction"
centers = "semi-transparent dark green glass fill with subtle inner glow"

[notes]
reassembly = "Resizable framed controls use 9-slice assets: tl, t, tr, l, c, r, bl, b, br. Corners remain fixed; edges stretch on their primary axis; centers stretch freely. Inspired by the Dribbble reference (userupload/43706659): clean modern SaaS UI with emerald tones, yellow highlights, white dividers, green typography, lime accents."
exclusions = "Text labels, captions, runtime values, dynamic glows, LEDs, and application-specific content are intentionally excluded. Image assets are structural reference; refine with exact slices from the source design for production."
